# 깃허브에 올릴 때마다 자동으로:
#   1) 안드로이드 앱(.apk)  2) 윈도우 설치 파일(.exe)  3) 웹 버전(공유 링크용)
# 을 만들고, 저장소의 'Releases'에 apk·exe를 올려 둔다.
name: 앱 만들기

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 공유 링크가 열릴 웹 주소. 저장소 변수(Variables) WEB_URL을 넣으면 그 주소를 쓰고,
  # 없으면 이 저장소의 깃허브 페이지 주소를 쓴다.
  WEB_URL: ${{ vars.WEB_URL != '' && vars.WEB_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
  VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: 안드로이드 (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: 도구 설치
        run: npm ci
      - name: 앱 화면 준비
        run: npm run www
      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          node scripts/setup-android.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#0a0a0b' --iconBackgroundColorDark '#0a0a0b' --splashBackgroundColor '#0a0a0b' --splashBackgroundColorDark '#0a0a0b'
          npx cap sync android

      - name: 서명키 준비
        env:
          KS: ${{ secrets.CF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/casefile.jks"
            echo "CF_KEYSTORE_FILE=$RUNNER_TEMP/casefile.jks" >> "$GITHUB_ENV"
            echo "서명키 사용"
          else
            echo "::warning::서명키(CF_KEYSTORE_BASE64)가 없어 임시 키로 서명해. 이 경우 다음 버전을 설치할 때 기존 앱을 지워야 할 수 있어. 안내서 3단계를 확인해 줘."
          fi

      - name: APK 빌드
        working-directory: android
        env:
          CF_KEYSTORE_PASSWORD: ${{ secrets.CF_KEYSTORE_PASSWORD }}
          CF_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk "CASE-FILE-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: CASE-FILE-*.apk
          if-no-files-found: error

  windows:
    name: 윈도우 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: 도구 설치
        run: npm ci
      - name: 앱 화면 준비
        run: npm run www
      - name: 설치 파일 빌드
        run: npx electron-builder --win --publish never "-c.extraMetadata.version=${{ env.VERSION }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Releases에 올리기
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: CASE FILE ${{ env.VERSION }}
          make_latest: true
          body: |
            - 안드로이드: `CASE-FILE-${{ env.VERSION }}.apk` 를 휴대폰에서 눌러 설치
            - 윈도우: `CASE-FILE-Setup-${{ env.VERSION }}.exe` 를 받아 실행
            - 공유 링크 주소: ${{ env.WEB_URL }}
          files: out/*

  web:
    name: 웹 버전 (깃허브 페이지)
    # 직접 운영하는 웹 주소(WEB_URL 변수)를 쓰면 건너뜀
    if: vars.WEB_URL == ''
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run www
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4
