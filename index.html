// 판정/메모 내부 컨트롤 이벤트 위임 (에디터 공통)
function bindBlockDelegation(container){
  container.addEventListener("click",e=>{
    const t=e.target;
    // 결과 칸 접기/펼치기 (헤드 클릭, 단 입력·삭제버튼 제외)
    const head=t.closest(".roll-res-head");
    if(head && !t.closest("input") && !t.closest(".roll-res-del")){
      head.closest(".roll-res").classList.toggle("collapsed"); persistActiveEditor(container); return;
    }
    if(t.closest(".roll-addres")){
      const results=t.closest(".roll-results");
      const tmp=document.createElement("div"); tmp.innerHTML=rollResHTML({title:"",body:"",collapsed:false}, true);
      results.insertBefore(tmp.firstElementChild, t.closest(".roll-addres"));
      persistActiveEditor(container); return;
    }
    if(t.closest(".roll-res-del")){
      const res=t.closest(".roll-res"); const block=t.closest(".roll-block");
      if(block.querySelectorAll(".roll-res").length>1){ res.remove(); persistActiveEditor(container); }
      else showToast("결과 칸은 최소 1개는 있어야 해.");
      return;
    }
    if(t.closest(".roll-del")){
      if(confirm("이 판정 블록을 삭제할까?")){ t.closest(".roll-block").remove(); persistActiveEditor(container); }
      return;
    }
    if(t.closest(".kp-memo-del")){
      t.closest(".kp-memo").remove(); persistActiveEditor(container); return;
    }
  });
  // 블록 내부 입력 저장 + 빈 줄 정리(커서 있는 텍스트 노드는 보존)
  container.addEventListener("input",e=>{
    if(e.target.closest(".roll-block")||e.target.closest(".kp-memo")){
      cleanBlockBodiesSafe(container);
      persistActiveEditor(container);
    }
  });
  // 블록 내부에서 Enter가 에디터를 깨지 않게 (input 필드에서 Enter 무시)
  container.addEventListener("keydown",e=>{
    if(e.key==="Enter" && e.target.matches(".roll-skill,.roll-res-title")){ e.preventDefault();
      // 다음 필드로 이동하거나 body로
      const res=e.target.closest(".roll-res");
      if(res){ const body=res.querySelector(".roll-res-body"); if(body){ body.focus(); } }
    }
  });
}
// 현재 컨테이너가 어떤 에디터냐에 따라 적절한 저장 호출
function persistActiveEditor(container){
  if(container.id==="fsTA"){ if(focus.active) focusPersist(); return; }
  const a=state.scenarios[state.activeId]; if(!a) return;
  const id=container.dataset?container.dataset.id:null;
  const s=id?a.scenes.find(x=>x.id===id):null;
  if(s){ s.desc=sanitizeHtml(container.innerHTML); syncSoon(); }
}

// 커서가 든 노드는 절대 제거하지 않으면서 빈 래퍼만 정리 + data-empty 갱신
function cleanBlockBodiesSafe(container){
  const sel=window.getSelection();
  const caretNode=sel.rangeCount?sel.getRangeAt(0).startContainer:null;
  const inNode=(el)=> caretNode && (el===caretNode || el.contains(caretNode));
  container.querySelectorAll(".roll-res-body,.kp-memo-body").forEach(body=>{
    const txt=body.textContent.replace(/\u200b/g,"").trim();
    if(txt===""){
      // 실제 내용 없음: 빈 래퍼 제거(커서 노드 제외) 후 data-empty 표시
      if(!inNode(body)){ if(body.innerHTML!=="") body.innerHTML=""; }
      else {
        let ch;
        while((ch=body.firstChild) && ch.nodeType===1 && ch.textContent.trim()==="" && /^(DIV|P|BR)$/.test(ch.tagName) && !inNode(ch)) body.removeChild(ch);
        while((ch=body.lastChild) && ch.nodeType===1 && ch.textContent.trim()==="" && /^(DIV|P|BR)$/.test(ch.tagName) && !inNode(ch)) body.removeChild(ch);
      }
      body.setAttribute("data-empty","1");
    } else {
      body.removeAttribute("data-empty");
      let ch;
      while((ch=body.firstChild) && ch.nodeType===1 && ch.textContent.trim()==="" && /^(DIV|P|BR)$/.test(ch.tagName) && !inNode(ch)) body.removeChild(ch);
      while((ch=body.lastChild) && ch.nodeType===1 && ch.textContent.trim()==="" && /^(DIV|P|BR)$/.test(ch.tagName) && !inNode(ch)) body.removeChild(ch);
    }
  });
}
/* ===== Focus bindings ===== */
function bindFocus(){
  const el=editorEl();
  el.addEventListener("input",onFocusInput);
  el.addEventListener("keydown",e=>{
    // 자동완성 네비게이션 우선
    if(acState.open){
      if(e.key==="ArrowDown"){ e.preventDefault(); acMove(1); return; }
      if(e.key==="ArrowUp"){ e.preventDefault(); acMove(-1); return; }
      if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); acPick(); return; }
      if(e.key==="Escape"){ e.preventDefault(); closeAutocomplete(); return; }
    }
    // 서식 단축키 (디밍 잠금 시 무시)
    if(e.ctrlKey||e.metaKey){
      const k=e.key.toLowerCase();
      if(k==="b"){ e.preventDefault(); exec("bold"); return; }
      if(k==="i"){ e.preventDefault(); exec("italic"); return; }
      if(k==="u"){ e.preventDefault(); exec("underline"); return; }
    }
    if(focus.sound){
      // 한글 IME 조합 중에는 e.key가 "Process"(keyCode 229)로 와서 length===1 조건에 걸리지 않음
      const comp = e.isComposing || e.keyCode===229 || e.key==="Process";
      if(e.key===" ") playKeySound("space");
      else if(e.key==="Enter") playKeySound(comp?"key":"enter"); // 조합 확정용 엔터는 벨 없이
      else if(comp||e.key.length===1||e.key==="Backspace") playKeySound("key");
    }
  });
  el.addEventListener("keyup",e=>{ if(focus.dim&&(e.key.startsWith("Arrow")||e.key==="Home"||e.key==="End")) renderDimLayer(); });
  el.addEventListener("click",()=>{ if(focus.dim) renderDimLayer(); updateFormatButtonStates(); closeAutocomplete(); });
  el.addEventListener("scroll",()=>{
    const dl=document.getElementById("fsDimLayer"); if(focus.dim&&dl) dl.scrollTop=el.scrollTop;
    const sl=document.getElementById("fsSpellLayer"); if(sl) sl.scrollTop=el.scrollTop;
  });
  el.addEventListener("mouseup",updateFormatButtonStates);
  el.addEventListener("keyup",updateFormatButtonStates);
  // 붙여넣기: 서식 제거하고 순수 텍스트로 (원치 않는 외부 서식 방지)
  el.addEventListener("paste",e=>{
    e.preventDefault();
    const txt=(e.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,txt);
  });

  on("fsExit","click",endFocusSession);
  on("fsumClose","click",()=>document.getElementById("focusSummary").classList.remove("show"));
  on("ffRoll","mousedown",e=>{ e.preventDefault(); insertRollBlock(); });
  on("ffMemo","mousedown",e=>{ e.preventDefault(); insertMemo(); });
  bindBlockDelegation(el);

  on("fsSound","click",()=>{ focus.sound=!focus.sound; if(focus.sound) ensureAudioCtx(); document.getElementById("fsSound").classList.toggle("on",focus.sound); saveFocusPrefs(); el.focus(); });
  on("fsTypewriter","click",()=>{ focus.typewriter=!focus.typewriter; document.getElementById("fsTypewriter").classList.toggle("on",focus.typewriter); document.getElementById("fsPage").classList.toggle("typewriter",focus.typewriter); if(focus.typewriter) scrollTypewriter(); saveFocusPrefs(); el.focus(); });
  on("fsDim","click",()=>{
    focus.dim=!focus.dim;
    document.getElementById("fsDim").classList.toggle("on",focus.dim);
    document.getElementById("fsScroll").classList.toggle("dim",focus.dim);
    if(focus.dim) renderDimLayer(); else clearDimLayer();
    saveFocusPrefs(); el.focus();
  });

  // 서식 버튼 (execCommand)
  document.querySelectorAll("#fsFormat [data-cmd]").forEach(b=>b.addEventListener("mousedown",e=>{
    e.preventDefault(); exec(b.dataset.cmd);
  }));

  // 색상 팝오버
  buildColorPop("ffColorPop",TEXT_COLORS,"fore");
  buildColorPop("ffBgPop",BG_COLORS,"back");
  wirePopToggle("ffColorBtn","ffColorPop");
  wirePopToggle("ffBgBtn","ffBgPop");
  wirePopToggle("ffSizeBtn","ffSizePop");
  document.querySelectorAll("#ffSizePop [data-size]").forEach(b=>b.addEventListener("mousedown",e=>{
    e.preventDefault(); applyFontSize(b.dataset.size); closePops();
  }));

  const setBtn=document.getElementById("fsSetBtn"), setPop=document.getElementById("fsSet");
  setBtn.addEventListener("click",e=>{ e.stopPropagation(); setPop.classList.toggle("open"); });
  setPop.addEventListener("click",e=>e.stopPropagation());
  document.getElementById("focusOverlay").addEventListener("click",()=>{ setPop.classList.remove("open"); closePops(); });

  document.querySelectorAll("#fsNudgeSeg [data-nudge]").forEach(b=>b.addEventListener("click",()=>{
    focus.nudgeSec=+b.dataset.nudge; applyNudgeUI(); saveFocusPrefs(); resetNudgeTimer(); hideNudge();
  }));
  document.querySelectorAll("#fsGoalSeg [data-goaltype]").forEach(b=>b.addEventListener("click",()=>{
    focus.goalType=b.dataset.goaltype; applyGoalUI(); saveFocusPrefs();
  }));
  on("fsGoalVal","input",e=>{ focus.goalVal=Math.max(1,+e.target.value||0); updateGoalBar(); saveFocusPrefs(); });

  // 볼륨 슬라이더 + 맞춤법 토글 (설정 팝오버에 존재)
  const vol=document.getElementById("fsVol");
  if(vol) vol.addEventListener("input",e=>{ focus.volume=(+e.target.value)/100; if(masterGain) masterGain.gain.value=focus.volume; updateVolumeUI(); saveFocusPrefs(); });
  const spellChk=document.getElementById("fsSpellChk");
  if(spellChk) spellChk.addEventListener("change",e=>{ focus.spell=e.target.checked; if(focus.spell) scheduleSpellcheck(); else clearSpellLayer(); saveFocusPrefs(); el.focus(); });

  // ESC
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&focus.active){
      if(acState.open){ return; }
      if(document.getElementById("focusSummary").classList.contains("show")) return;
      if(setPop.classList.contains("open")){ setPop.classList.remove("open"); return; }
      e.preventDefault(); e.stopPropagation(); endFocusSession();
    }
  },true);
}

function exec(cmd){
  editorEl().focus();
  document.execCommand(cmd,false,null);
  updateFormatButtonStates();
  onFocusInput();
}
function applyFontSize(size){
  editorEl().focus();
  const sel=window.getSelection(); if(!sel.rangeCount||sel.isCollapsed){ return; }
  // 선택 영역을 span으로 감싸 font-size 지정
  const range=sel.getRangeAt(0);
  const span=document.createElement("span"); span.style.fontSize=size;
  try{ span.appendChild(range.extractContents()); range.insertNode(span);
    // 커서 복원
    sel.removeAllRanges(); const nr=document.createRange(); nr.selectNodeContents(span); nr.collapse(false); sel.addRange(nr);
  }catch(e){}
  onFocusInput();
}
function buildColorPop(popId,colors,which){
  const pop=document.getElementById(popId); if(!pop) return;
  pop.innerHTML="";
  // 제거(없음) 칩
  const none=document.createElement("button"); none.className="ff-chip none"; none.title="색 없음";
  none.addEventListener("mousedown",e=>{ e.preventDefault();
    editorEl().focus(); document.execCommand(which==="fore"?"foreColor":"hiliteColor",false, which==="fore"?"#e8e6e3":"transparent"); closePops(); onFocusInput(); });
  pop.appendChild(none);
  colors.forEach(c=>{ const b=document.createElement("button"); b.className="ff-chip"; b.style.background=c; b.title=c;
    b.addEventListener("mousedown",e=>{ e.preventDefault();
      editorEl().focus();
      // hiliteColor가 일부 브라우저에서 안 먹으면 backColor로 폴백
      const ok=document.execCommand(which==="fore"?"foreColor":"hiliteColor",false,c);
      if(which==="back"&&!ok) document.execCommand("backColor",false,c);
      closePops(); onFocusInput(); });
    pop.appendChild(b); });
}
function wirePopToggle(btnId,popId){
  const btn=document.getElementById(btnId), pop=document.getElementById(popId);
  if(!btn||!pop) return;
  btn.addEventListener("mousedown",e=>{ e.preventDefault();
    const wasOpen=pop.classList.contains("open"); closePops(); if(!wasOpen) pop.classList.add("open"); });
}
function closePops(){ document.querySelectorAll("#fsFormat .ff-pop").forEach(p=>p.classList.remove("open")); }
function updateFormatButtonStates(){
  try{
    [["bold","bold"],["italic","italic"],["underline","underline"],["strikeThrough","strikeThrough"]].forEach(([cmd,q])=>{
      const on=document.queryCommandState(q);
      const btn=document.querySelector(`#fsFormat [data-cmd="${cmd}"]`);
      if(btn) btn.classList.toggle("on",on);
    });

}

/* ===== Export ===== */
function exportMarkdown(){
  const a=active(), o=a.overview, num=numbering(a);
  let md=`# ${a.title||"시나리오"}\n\n`;
  md+=`> 룰: ${activeSystem().name}\n\n`;
  const meta=[o.era&&`배경: ${o.era}`,o.place&&`무대: ${o.place}`,o.players&&`인원·시간: ${o.players}`].filter(Boolean);
  if(meta.length) md+=meta.join(" · ")+"\n\n";
  if(o.hook) md+=`## 도입\n\n${o.hook}\n\n`;
  if(o.summary) md+=`## 진상 (KP 전용)\n\n${o.summary}\n\n`;
  a.acts.forEach(act=>{
    const scenes=a.scenes.filter(s=>s.actId===act.id).sort((x,y)=>x.order-y.order);
    if(!scenes.length) return;
    md+=`---\n\n# ${act.title}\n\n`;
    scenes.forEach(s=>{
      md+=`## ${String(num[s.id]).padStart(2,"0")}. [${s.type}] ${s.title||"제목 없음"}\n\n`;
      if(s.logline) md+=`*${s.logline}*\n\n`;
      const refs=[];
      s.npcs.forEach(id=>{const c=a.npcs.find(x=>x.id===id);if(c)refs.push(c.name||"무제");});
      s.locations.forEach(id=>{const c=a.locations.find(x=>x.id===id);if(c)refs.push(c.name||"무제");});
      s.clues.forEach(id=>{const c=a.clues.find(x=>x.id===id);if(c)refs.push("단서:"+(c.name||"무제"));});
      const nexts=a.edges.filter(e=>e.from===s.id).map(e=>{const t=a.scenes.find(x=>x.id===e.to);return t?`${String(num[t.id]).padStart(2,"0")} ${t.title||"무제"}`:null;}).filter(Boolean);
      if(refs.length) md+=`등장: ${refs.join(", ")}\n\n`;
      if(s.readAloud) md+=`> ${htmlToMarkdown(s.readAloud).replace(/\n/g,"\n> ")}\n\n`;
      if(stripHtml(s.desc||"").trim()) md+=htmlToMarkdown(s.desc)+"\n\n";
      if(s.kpNotes) md+=`**KP 노트:** ${stripHtml(s.kpNotes)}\n\n`;
      if(nexts.length) md+=`→ 이어지는 씬: ${nexts.join(" · ")}\n\n`;
    });
  });
  if(a.npcs.length){ md+=`---\n\n# 등장인물\n\n`; const parts=sbSchema(); a.npcs.forEach(n=>{ md+=`## ${n.name||"이름 없음"}${n.role?` — ${n.role}`:""}\n\n`; if(n.appearance)md+=n.appearance+"\n\n"; if(n.motive)md+=`동기: ${n.motive}\n\n`;
    parts.forEach(p=>{
      if(p.type==="fields"){
        const fs=p.fields.filter(f=>n.sb[f.key]!=null&&n.sb[f.key]!=="").map(f=>`${f.label} ${n.sb[f.key]}`);
        if(fs.length) md+=fs.join(" · ")+"\n\n";
        if(p.derive){ const dl=(p.derive(n.sb)||[]).filter(x=>x.value!=null&&x.value!=="").map(x=>`${x.label} ${x.value}`); if(dl.length) md+=dl.join(" · ")+"\n\n"; }
      } else if(p.type==="rows"){
        const rows=(n.sb[p.id]||[]).filter(r=>r&&r.name).map(r=>{ const extra=p.cols.slice(1).map(c=>r[c.key]).filter(Boolean).join(" / "); return `${r.name}${extra?` ${extra}`:""}`; });
        if(rows.length) md+=`${p.label}: ${rows.join(", ")}\n\n`;
      } else if(p.type==="text"){ if(n.sb[p.id]) md+=`${p.label}: ${n.sb[p.id]}\n\n`; }
    });
    if(n.stats)md+=n.stats+"\n\n"; if(n.notes)md+=n.notes+"\n\n"; }); }
  if(a.locations.length){ md+=`---\n\n# 장소\n\n`; a.locations.forEach(l=>{ md+=`## ${l.name||"이름 없음"}\n\n`; if(l.desc) md+=l.desc+"\n\n"; if(l.notes) md+=`**KP 비고:** ${l.notes}\n\n`; }); }
  if(a.clues.length){ md+=`---\n\n# 단서\n\n`; a.clues.forEach(c=>{
    const leads=(c.leadsScenes||[]).map(id=>{ const t=a.scenes.find(x=>x.id===id); return t?`${String(num[t.id]).padStart(2,"0")} ${t.title||"무제"}`:null; }).filter(Boolean);
    const where=[c.leadsTo,leads.length?`씬 ${leads.join(", ")}`:""].filter(Boolean).join(" / ");
    md+=`- **${c.name||"무제"}**${c.source?` (${c.source})`:""}: ${c.content||""}${where?` → ${where}`:""}\n`; }); md+="\n"; }
  if(a.handouts.length){ md+=`---\n\n# 핸드아웃\n\n`; a.handouts.forEach(h=>{ md+=`## ${h.title||"제목 없음"}\n\n${h.content||""}\n\n${h.imageUrl?`![${h.title||"핸드아웃"}](${h.imageUrl})\n\n`:""}`; }); }
  downloadText(md,safeName(a.title)+".md","text/markdown");
}

/* ===== 다운로드 공통 ===== */
function safeName(t){ return (t||"scenario").replace(/[\\/:*?"<>|]/g,"_"); }
function downloadText(text,filename,mime){
  // 한글 깨짐 방지: 텍스트 파일에는 UTF-8 BOM을 붙여 메모장·엑셀에서도 바로 열리게
  const bom=/^text\//.test(mime)?"﻿":"";
  return saveBlob(new Blob([bom+text],{type:mime+";charset=utf-8"}),filename);
}
// 파일 저장: 웹·윈도우는 다운로드, 안드로이드는 '문서/CASE FILE' 폴더에 저장 후 보내기 버튼
function blobToBase64(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); });
}
async function shareNativeFile(uri,filename){
  try{ await nativePlugin("Share").share({title:filename,files:[uri],dialogTitle:"보낼 곳 고르기"}); }
  catch(e){ if(!/cancel/i.test(String((e&&e.message)||e))) showToast("보내기 실패: "+((e&&e.message)||e)); }
}
async function saveBlob(blob,filename){
  if(IS_NATIVE){
    const FS=nativePlugin("Filesystem");
    let data;
    try{ data=await blobToBase64(blob); }catch(e){ showToast("파일을 만들지 못했어."); return false; }
    try{
      const r=await FS.writeFile({path:"CASE FILE/"+filename,data,directory:"DOCUMENTS",recursive:true});
      showToast(`'문서/CASE FILE'에 저장했어 · ${filename}`,"보내기",()=>shareNativeFile(r.uri,filename),8000);
      return true;
    }catch(e){
      // 문서 폴더에 못 쓰는 기기: 임시 저장 후 바로 보내기 창
      try{ const r=await FS.writeFile({path:filename,data,directory:"CACHE"}); await shareNativeFile(r.uri,filename); return true; }
      catch(e2){ showToast("파일 저장 실패: "+((e2&&e2.message)||e2)); return false; }
    }
  }
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a"); link.href=url; link.download=filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  return true;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); return ok;
  }
}

/* ===== 코코포리아 말(캐릭터) 복사 =====
   코코포리아 방 화면에 Ctrl+V 하면 말이 생성되는 클립보드 형식.
   메모는 플레이어에게도 보이므로 역할·외형만 넣고 동기·비밀은 넣지 않는다. */
function cocoDmg(dmg,db){
  let d=String(dmg||"").trim(); if(!d) return "";
  const dbs=(db&&db!=="0")?(/^[+-]/.test(db)?db:"+"+db):"";
  d=d.replace(/\s*\+?\s*DB/i,dbs);
  return /\d*d\d+/i.test(d)?d:"";
}
function cocofoliaPiece(n,a){
  const sys=a.system||"coc7", sb=n.sb||{};
  const params=[], status=[], cmds=[];
  let initiative=0;
  if(sys==="coc7"){
    const d=deriveSB(sb);
    if(d.hp!=null) status.push({label:"HP",value:d.hp,max:d.hp});
    if(d.mp!=null) status.push({label:"MP",value:d.mp,max:d.mp});
    if(d.san!=null) status.push({label:"SAN",value:d.san,max:99});
    CHAR_KEYS.forEach(k=>{ if(sb[k]!==""&&sb[k]!=null) params.push({label:k,value:String(sb[k])}); });
    if(d.db) params.push({label:"DB",value:d.db});
    initiative=numOr(sb.DEX)||0;
    (sb.skills||[]).forEach(r=>{ if(r&&r.name&&numOr(r.val)!=null) cmds.push(`CC<=${numOr(r.val)} 【${r.name}】`); });
    (sb.attacks||[]).forEach(r=>{ if(!r||!r.name) return;
      if(numOr(r.val)!=null) cmds.push(`CC<=${numOr(r.val)} 【${r.name}】`);
      const dm=cocoDmg(r.dmg,d.db); if(dm) cmds.push(`${dm} 【${r.name} 피해】`); });
    ["STR","CON","DEX","POW","INT","APP","SIZ","EDU"].forEach(k=>{ const v=numOr(sb[k]); if(v!=null) cmds.push(`CC<=${v} 【${k}】`); });
  } else {
    const schema=SYSTEMS[sys]&&SYSTEMS[sys].sb ? SYSTEMS[sys].sb
      : [{type:"fields",fields:(a.customFields||[]).map(f=>({key:f.id,label:f.label||"필드"}))},{type:"rows",id:"skills"},{type:"rows",id:"attacks"}];
    const STATUS_KEYS=/^(HP|LP|SAN|MP|생명력|이성|체력|회복)$/i;
    schema.forEach(p=>{
      if(p.type==="fields") p.fields.forEach(f=>{ const v=sb[f.key]; if(v===""||v==null) return;
        if(STATUS_KEYS.test(f.label)&&numOr(v)!=null) status.push({label:f.label,value:numOr(v),max:numOr(v)});
        else params.push({label:f.label,value:String(v)});
        if(/^(INIT|선제|이니셔티브|행동값)$/i.test(f.key)||/선제|이니셔티브/.test(f.label)) initiative=numOr(v)||initiative; });
    });
    if(!initiative && sys==="dnd5"){ const m=dnd5Mod(sb.DEX); if(m!=null) initiative=m; }
    const d20=(sys==="dnd5"||sys==="age13");
    ["skills","attacks"].forEach(id=>(sb[id]||[]).forEach(r=>{ if(!r||!r.name) return;
      const v=String(r.val||"").trim();
      if(/^[+-]?\d+$/.test(v) && d20) cmds.push(`1d20${/^[+-]/.test(v)?v:"+"+v} 【${r.name}】`);
      else { const m=v.match(/^(\d*d\d+[^\s]*)/i); if(m) cmds.push(`${m[1]} 【${r.name}】`); }
      const dm=cocoDmg(r.dmg,""); if(dm) cmds.push(`${dm} 【${r.name} 피해】`);
    }));
  }
  const memo=[n.role,n.appearance].filter(Boolean).join("\n");
  return JSON.stringify({kind:"character",data:{name:n.name||"이름 없음",initiative,externalUrl:"",iconUrl:"",
    commands:cmds.join("\n"),status,params,memo,secret:false,invisible:false,hideStatus:false}});
}
async function copyCocofolia(n){
  const ok=await copyText(cocofoliaPiece(n,active()));
  showToast(ok?`"${n.name||'NPC'}" 복사됨 · 코코포리아 방에서 Ctrl+V`:"복사에 실패했어. 브라우저 권한을 확인해 줘.");
}

/* ===== 문서 모델 (Word · 구글 문서 공용) =====
   블록 종류: title / h1 / h2 / h3 / meta / label / p / quote / bullet / roll / memo / img
   글자 조각(run): {text, b, i, u, s, color, bg, size}  — 색은 흰 종이 기준으로 이미 바꿔 둠 */
const DOCX_URL="https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js";
// 구글 드라이브에 바로 올리려면 구글 클라우드에서 만든 OAuth 클라이언트 ID를 넣어 (비워 두면 '복사해서 붙여넣기'만 사용)
const GOOGLE_CLIENT_ID="";
const _scriptCache={};
function loadScript(url){
  if(!_scriptCache[url]) _scriptCache[url]=new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src=url; s.async=true;
    s.onload=()=>res(); s.onerror=()=>{ delete _scriptCache[url]; s.remove(); rej(new Error("load fail "+url)); };
    document.head.appendChild(s);
  });
  return _scriptCache[url];
}
async function loadDocxLib(){ if(!window.docx) await loadScript(DOCX_URL); return window.docx; }

function hexOf(c){
  if(!c) return null; c=String(c).trim();
  let m=c.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(m){ let h=m[1]; if(h.length===3) h=h.split("").map(x=>x+x).join(""); return h.toLowerCase(); }
  m=c.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)(?:\s*,\s*([\d.]+))?/i);
  if(m){ if(m[4]!=null&&+m[4]===0) return null; return [m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,"0")).join(""); }
  return null;
}
function _rgb(h){ return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function _toHex(a){ return a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join(""); }
function _lum(h){ const [r,g,b]=_rgb(h).map(v=>v/255); return 0.2126*r+0.7152*g+0.0722*b; }
// 어두운 화면에서 고른 글자색 → 흰 종이에서 읽히게 (거의 흰 회색은 기본 검정으로, 밝은 색은 어둡게)
function paperText(c){
  const h=hexOf(c); if(!h) return null;
  const rgb=_rgb(h), sat=Math.max(...rgb)-Math.min(...rgb), L=_lum(h);
  if(L>0.7 && sat<40) return null;
  if(L>0.45) return _toHex(rgb.map(v=>v*0.62));
  return h;
}
// 어두운 형광펜 → 옅은 형광펜
function paperBg(c){
  const h=hexOf(c); if(!h||h==="000000") return null;
  return _toHex(_rgb(h).map(v=>v+(255-v)*(_lum(h)<0.4?0.72:0.5)));
}

// 서식 있는 본문 HTML → 블록 목록
function richToBlocks(html){
  const blocks=[]; let cur=null;
  const flush=()=>{ if(cur&&cur.runs.some(r=>r.text.trim())) blocks.push(cur); cur=null; };
  const push=(text,st)=>{ if(!text) return; if(!cur) cur={t:"p",runs:[]}; cur.runs.push(Object.assign({text},st)); };
  const src=isRichHtml(html)?sanitizeHtml(html):esc(String(html||"")).replace(/\n/g,"<br>");
  (function walk(node,st){
    for(const c of node.childNodes){
      if(c.nodeType===3){ c.textContent.split("\n").forEach((part,i)=>{ if(i>0) flush(); push(part.replace(/​/g,""),st); }); continue; }
      if(c.nodeType!==1) continue;
      if(c.classList.contains("roll-block")){
        flush(); let d={}; try{ d=JSON.parse(c.getAttribute("data-roll")||"{}"); }catch(e){}
        blocks.push({t:"roll",skill:d.skill||"",results:(d.results||[]).map(r=>({title:r.title||"",blocks:richToBlocks(r.body||"")}))});
        continue;
      }
      if(c.classList.contains("kp-memo")){ flush(); const tx=(c.getAttribute("data-memo")||"").trim(); if(tx) blocks.push({t:"memo",text:tx}); continue; }
      const tag=c.tagName, ns=Object.assign({},st);
      if(tag==="B"||tag==="STRONG") ns.b=true;
      if(tag==="I"||tag==="EM") ns.i=true;
      if(tag==="U") ns.u=true;
      if(tag==="S"||tag==="STRIKE"||tag==="DEL") ns.s=true;
      const css=c.getAttribute("style")||"";
      let m=css.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i); if(m){ const pc=paperText(m[1]); if(pc) ns.color=pc; else delete ns.color; }
      m=css.match(/background-color\s*:\s*([^;]+)/i); if(m){ const pb=paperBg(m[1]); if(pb) ns.bg=pb; }
      m=css.match(/font-size\s*:\s*([\d.]+)em/i); if(m) ns.size=+m[1];
      if(tag==="BR"){ flush(); continue; }
      const isBlock=(tag==="DIV"||tag==="P");
      if(isBlock) flush();
      walk(c,ns);
      if(isBlock) flush();
    }
  })(parseInert(src),{});
  flush();
  return blocks;
}
function plainBlocks(str,t,st){ return String(str||"").split("\n").filter(x=>x.trim()).map(l=>({t:t||"p",runs:[Object.assign({text:l},st||{})]})); }
function npcStatLines(n){
  const out=[], sb=n.sb||{};
  sbSchema().forEach(p=>{
    if(p.type==="fields"){
      const fs=p.fields.filter(f=>sb[f.key]!=null&&sb[f.key]!=="").map(f=>`${f.label} ${sb[f.key]}`);
      if(fs.length) out.push(fs.join(" · "));
      if(p.derive){ const dl=(p.derive(sb)||[]).filter(x=>x.value!=null&&x.value!=="").map(x=>`${x.label} ${x.value}`); if(dl.length) out.push(dl.join(" · ")); }
    } else if(p.type==="rows"){
      const rows=(sb[p.id]||[]).filter(r=>r&&r.name).map(r=>{ const ex=p.cols.slice(1).map(c=>r[c.key]).filter(Boolean).join(" / "); return r.name+(ex?" "+ex:""); });
      if(rows.length) out.push(`${p.label}: ${rows.join(", ")}`);
    } else if(p.type==="text"){ if(sb[p.id]) out.push(`${p.label}: ${sb[p.id]}`); }
  });
  return out;
}

// mode: "kp" = KP용 전문 / "player" = 플레이어 배포용 (공유 링크와 같은 범위만)
function buildDocModel(a,mode){
  const B=[], num=numbering(a), two=n=>String(n).padStart(2,"0");
  const P=(text,st)=>({t:"p",runs:[Object.assign({text},st||{})]});
  const src=mode==="player"?migrate(buildSharePayload(a)):a;
  const o=src.overview||{};
  B.push({t:"title",runs:[{text:a.title||"시나리오"}]});
  const meta=[o.era&&`배경 ${o.era}`,o.place&&`무대 ${o.place}`,o.players&&`인원·시간 ${o.players}`].filter(Boolean);
  B.push({t:"meta",runs:[{text:[activeSystem().name].concat(meta).join("  ·  ")+(mode==="player"?"  ·  플레이어 배포용":"")}]});
  if(o.hook){ B.push({t:"h2",runs:[{text:"도입"}]}); B.push(...plainBlocks(o.hook)); }
  if(mode!=="player" && o.summary){ B.push({t:"h2",runs:[{text:"진상 (KP 전용)"}]}); B.push(...plainBlocks(o.summary)); }

  let firstAct=true;
  src.acts.forEach(act=>{
    const scenes=src.scenes.filter(s=>s.actId===act.id).sort((x,y)=>x.order-y.order);
    if(!scenes.length) return;
    B.push({t:"h1",runs:[{text:act.title||"막"}],newPage:!firstAct}); firstAct=false;
    scenes.forEach(s=>{
      const n=num[s.id]||0;
      B.push({t:"h2",runs:[{text:`${two(n)}. ${s.title||"제목 없는 씬"}`},{text:`   ${s.type||""}`,color:"8a8580",size:0.75}]});
      if(mode==="player"){ if(stripHtml(s.readAloud||"").trim()) B.push(...plainBlocks(stripHtml(s.readAloud),"quote")); return; }
      if(s.logline) B.push(P(s.logline,{i:true,color:"666666"}));
      const refs=[];
      s.npcs.forEach(id=>{const c=a.npcs.find(x=>x.id===id);if(c)refs.push(c.name||"무제");});
      s.locations.forEach(id=>{const c=a.locations.find(x=>x.id===id);if(c)refs.push(c.name||"무제");});
      s.clues.forEach(id=>{const c=a.clues.find(x=>x.id===id);if(c)refs.push("단서: "+(c.name||"무제"));});
      if(refs.length) B.push({t:"p",runs:[{text:"등장  ",b:true,color:"666666"},{text:refs.join(", "),color:"666666"}]});
      if(stripHtml(s.readAloud||"").trim()){ B.push({t:"label",runs:[{text:"낭독"}]}); B.push(...plainBlocks(stripHtml(s.readAloud),"quote")); }
      if(stripHtml(s.desc||"").trim()) B.push(...richToBlocks(s.desc));
      if(stripHtml(s.kpNotes||"").trim()) B.push({t:"memo",text:stripHtml(s.kpNotes),label:"KP 노트"});
      const nexts=a.edges.filter(e=>e.from===s.id).map(e=>{const t=a.scenes.find(x=>x.id===e.to);return t?`${two(num[t.id])} ${t.title||"무제"}`:null;}).filter(Boolean);
      if(nexts.length) B.push(P("→ 이어지는 씬: "+nexts.join(" · "),{color:"666666"}));
    });
  });

  const npcs=(src.npcs||[]).filter(n=>n.name||mode!=="player");
  if(npcs.length){
    B.push({t:"h1",runs:[{text:"등장인물"}],newPage:true});
    npcs.forEach(n=>{
      B.push({t:"h3",runs:[{text:n.name||"이름 없음"}].concat(n.role?[{text:"  "+n.role,color:"8a8580",b:false}]:[])});
      if(n.appearance) B.push(...plainBlocks(n.appearance));
      if(mode!=="player"){
        if(n.motive) B.push({t:"p",runs:[{text:"동기 · 비밀  ",b:true},{text:n.motive}]});
        npcStatLines(n).forEach(l=>B.push(P(l,{color:"333333",size:0.92})));
        if(n.stats) B.push(...plainBlocks(n.stats));
        if(n.notes) B.push({t:"memo",text:n.notes,label:"KP 비고"});
      }
    });
  }
  const locs=(src.locations||[]).filter(l=>l.name||mode!=="player");
  if(locs.length){
    B.push({t:"h1",runs:[{text:"장소"}]});
    locs.forEach(l=>{ B.push({t:"h3",runs:[{text:l.name||"이름 없음"}]}); if(l.desc) B.push(...plainBlocks(l.desc));
      if(mode!=="player"&&l.notes) B.push({t:"memo",text:l.notes,label:"KP 비고"}); });
  }
  if(mode!=="player" && a.clues.length){
    B.push({t:"h1",runs:[{text:"단서"}]});
    a.clues.forEach(c=>{
      const leads=(c.leadsScenes||[]).map(id=>{ const t=a.scenes.find(x=>x.id===id); return t?`${two(num[t.id])} ${t.title||"무제"}`:null; }).filter(Boolean);
      const where=[c.leadsTo,leads.length?"씬 "+leads.join(", "):""].filter(Boolean).join(" / ");
      B.push({t:"bullet",runs:[{text:c.name||"무제",b:true}].concat(c.source?[{text:` (${c.source})`,color:"666666"}]:[],[{text:c.content?": "+c.content:""}],where?[{text:"  → "+where,color:"4f6a3a"}]:[])});
    });
  }
  const hos=src.handouts||[];
  if(hos.length){
    B.push({t:"h1",runs:[{text:"핸드아웃"}],newPage:true});
    hos.forEach(h=>{ B.push({t:"h3",runs:[{text:h.title||"제목 없음"}]}); B.push(...plainBlocks(h.content,"quote")); if(h.imageUrl) B.push({t:"img",url:h.imageUrl,alt:h.title||"핸드아웃"}); });
  }
  return B;
}

// 이미지 → PNG 바이트 (Word용). 다른 서버 이미지가 막히면 링크로 대신 넣음
function loadImageBytes(url,maxW){
  return new Promise(res=>{
    const im=new Image(); im.crossOrigin="anonymous";
    im.onload=()=>{ try{
      const k=Math.min(1,(maxW||1200)/im.naturalWidth), w=Math.max(1,Math.round(im.naturalWidth*k)), h=Math.max(1,Math.round(im.naturalHeight*k));
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(im,0,0,w,h);
      cv.toBlob(b=>{ if(!b) return res(null); b.arrayBuffer().then(buf=>res({data:buf,w,h})); },"image/png");
    }catch(e){ res(null); } };
    im.onerror=()=>res(null);
    setTimeout(()=>res(null),12000);
    im.src=url;
  });
}

/* ----- Word (.docx) ----- */
async function exportDocx(mode){
  showToast("Word 파일 만드는 중…",null,null,2500);
  let D;
  try{ D=await loadDocxLib(); }catch(e){ showToast("Word 변환 도구를 불러오지 못했어. 인터넷 연결을 확인해 줘."); return; }
  const a=active(), model=buildDocModel(a,mode);
  for(const blk of model){ if(blk.t==="img") blk.img=await loadImageBytes(blk.url,1200); }
  const FONT="맑은 고딕";
  const run=r=>new D.TextRun({ text:r.text, bold:r.b||undefined, italics:r.i||undefined, underline:r.u?{}:undefined, strike:r.s||undefined,
    color:r.color||undefined, size:r.size?Math.round(21*r.size):undefined,
    shading:r.bg?{type:D.ShadingType.CLEAR,color:"auto",fill:r.bg}:undefined });
  const box=(fill,line)=>({ shading:{type:D.ShadingType.CLEAR,color:"auto",fill},
    border:{left:{style:D.BorderStyle.SINGLE,size:18,color:line,space:8}}, indent:{left:180,right:120}, spacing:{before:60,after:60} });
  const para=blk=>{
    switch(blk.t){
      case "title": return [new D.Paragraph({heading:D.HeadingLevel.TITLE,children:blk.runs.map(run)})];
      case "h1": return [new D.Paragraph({heading:D.HeadingLevel.HEADING_1,pageBreakBefore:!!blk.newPage,children:blk.runs.map(run)})];
      case "h2": return [new D.Paragraph({heading:D.HeadingLevel.HEADING_2,keepNext:true,children:blk.runs.map(run)})];
      case "h3": return [new D.Paragraph({heading:D.HeadingLevel.HEADING_3,keepNext:true,children:blk.runs.map(run)})];
      case "meta": return [new D.Paragraph({spacing:{after:240},children:blk.runs.map(r=>run(Object.assign({color:"777777",size:0.9},r)))})];
      case "label": return [new D.Paragraph({spacing:{before:120,after:40},keepNext:true,children:blk.runs.map(r=>run(Object.assign({b:true,color:"888888",size:0.8},r)))})];
      case "quote": return [new D.Paragraph(Object.assign(box("F2F2EE","9A9A90"),{children:blk.runs.map(run)}))];
      case "bullet": return [new D.Paragraph({bullet:{level:0},children:blk.runs.map(run)})];
      case "memo": return [new D.Paragraph(Object.assign(box("FBF1E6","E5924D"),{children:[run({text:(blk.label||"KP 메모")+"  ",b:true,color:"B8641E",size:0.85}),run({text:blk.text,color:"5A3C1E"})]}))];
      case "img":
        if(blk.img){ const maxW=430, k=Math.min(1,maxW/blk.img.w);
          return [new D.Paragraph({spacing:{before:80,after:160},children:[new D.ImageRun({type:"png",data:blk.img.data,transformation:{width:Math.round(blk.img.w*k),height:Math.round(blk.img.h*k)},altText:{name:blk.alt,description:blk.alt,title:blk.alt}})]})]; }
        return [new D.Paragraph({children:[run({text:"(이미지) "+blk.url,color:"666666",size:0.85})]})];
      case "roll": {
        const cellOpts=fill=>({ shading:fill?{type:D.ShadingType.CLEAR,color:"auto",fill}:undefined, margins:{top:80,bottom:80,left:140,right:140} });
        const rows=[new D.TableRow({children:[new D.TableCell(Object.assign(cellOpts("E7EDDD"),{children:[new D.Paragraph({children:[run({text:"판정  ",b:true,color:"4F6A3A",size:0.85}),run({text:blk.skill||"—",b:true})]})]}))]})];
        (blk.results.length?blk.results:[{title:"",blocks:[]}]).forEach(r=>{
          const inner=[new D.Paragraph({children:[run({text:r.title||"결과",b:true,color:"4F6A3A"})]})];
          r.blocks.forEach(b=>inner.push(...para(b)));
          rows.push(new D.TableRow({children:[new D.TableCell(Object.assign(cellOpts(null),{children:inner}))]}));
        });
        const ln={style:D.BorderStyle.SINGLE,size:6,color:"B9C4A6"};
        return [new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},borders:{top:ln,bottom:ln,left:ln,right:ln,insideHorizontal:ln,insideVertical:ln},rows}),
                new D.Paragraph({spacing:{after:60},children:[]})];
      }
      default: return [new D.Paragraph({spacing:{after:100},children:(blk.runs||[]).map(run)})];
    }
  };
  const children=[]; model.forEach(b=>children.push(...para(b)));
  const doc=new D.Document({
    creator:"CASE FILE", title:a.title||"시나리오",
    styles:{ default:{
      document:{run:{font:FONT,size:21},paragraph:{spacing:{line:300}}},
      title:{run:{font:FONT,size:40,bold:true,color:"1A1A1A"},paragraph:{spacing:{after:80}}},
      heading1:{run:{font:FONT,size:30,bold:true,color:"4F6A3A"},paragraph:{spacing:{before:360,after:160}}},
      heading2:{run:{font:FONT,size:25,bold:true,color:"1A1A1A"},paragraph:{spacing:{before:300,after:100}}},
      heading3:{run:{font:FONT,size:22,bold:true,color:"1A1A1A"},paragraph:{spacing:{before:200,after:60}}}
    }},
    sections:[{
      properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},
      footers:{default:new D.Footer({children:[new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.TextRun({children:[D.PageNumber.CURRENT],size:18,color:"999999"})]})]})},
      children
    }]
  });
  const blob=await D.Packer.toBlob(doc);
  const ok=await saveBlob(blob,safeName(a.title)+(mode==="player"?"_플레이어용":"")+".docx");
  if(ok&&!IS_NATIVE) showToast("Word 파일을 받았어.");
}

/* ----- 구글 문서용 HTML ----- */
function renderDocHtml(model,title){
  const e=esc;
  const runHtml=r=>{ let st=[]; if(r.b) st.push("font-weight:700"); if(r.i) st.push("font-style:italic");
    const deco=[r.u&&"underline",r.s&&"line-through"].filter(Boolean); if(deco.length) st.push("text-decoration:"+deco.join(" "));
    if(r.color) st.push("color:#"+r.color); if(r.bg) st.push("background-color:#"+r.bg); if(r.size) st.push("font-size:"+(11*r.size).toFixed(1)+"pt");
    return st.length?`<span style="${st.join(";")}">${e(r.text)}</span>`:e(r.text); };
  const runs=b=>(b.runs||[]).map(runHtml).join("");
  const boxTable=(fill,line,inner)=>`<table style="border-collapse:collapse;width:100%;margin:4pt 0"><tr><td style="background-color:#${fill};border-left:3pt solid #${line};padding:6pt 10pt">${inner}</td></tr></table>`;
  const blk=b=>{
    switch(b.t){
      case "title": return `<h1 style="font-size:22pt">${runs(b)}</h1>`;
      case "h1": return (b.newPage?'<hr>':'')+`<h1 style="color:#4f6a3a">${runs(b)}</h1>`;
      case "h2": return `<h2>${runs(b)}</h2>`;
      case "h3": return `<h3>${runs(b)}</h3>`;
      case "meta": return `<p style="color:#777777;font-size:10pt">${runs(b)}</p>`;
      case "label": return `<p style="color:#888888;font-size:9pt;font-weight:700;margin-bottom:0">${runs(b)}</p>`;
      case "quote": return boxTable("f2f2ee","9a9a90",`<p style="margin:0">${runs(b)}</p>`);
      case "bullet": return `<ul><li>${runs(b)}</li></ul>`;
      case "memo": return boxTable("fbf1e6","e5924d",`<p style="margin:0"><b style="color:#b8641e;font-size:9pt">${e(b.label||"KP 메모")}</b>&nbsp;&nbsp;<span style="color:#5a3c1e">${e(b.text).replace(/\n/g,"<br>")}</span></p>`);
      case "img": return `<p><img src="${e(b.url)}" alt="${e(b.alt||"")}" width="430"></p>`;
      case "roll": {
        let h=`<table style="border-collapse:collapse;width:100%;margin:4pt 0" border="1" bordercolor="#b9c4a6"><tr><td style="background-color:#e7eddd;padding:5pt 10pt;border:1pt solid #b9c4a6"><b style="color:#4f6a3a;font-size:9pt">판정</b>&nbsp;&nbsp;<b>${e(b.skill||"—")}</b></td></tr>`;
        (b.results.length?b.results:[{title:"",blocks:[]}]).forEach(r=>{ h+=`<tr><td style="padding:5pt 10pt;border:1pt solid #b9c4a6"><p style="margin:0"><b style="color:#4f6a3a">${e(r.title||"결과")}</b></p>${r.blocks.map(blk).join("")}</td></tr>`; });
        return h+"</table><p></p>";
      }
      default: return `<p>${runs(b)}</p>`;
    }
  };
  return `<html><head><meta charset="utf-8"><title>${e(title||"")}</title></head><body style="font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:11pt">${model.map(blk).join("\n")}</body></html>`;
}
function modelToPlain(model){
  return model.map(b=>{
    if(b.t==="roll") return `[판정: ${b.skill}]\n`+b.results.map(r=>`${r.title||"결과"}: `+r.blocks.map(x=>(x.runs||[]).map(y=>y.text).join("")).join(" ")).join("\n");
    if(b.t==="memo") return `[${b.label||"KP 메모"}] ${b.text}`;
    if(b.t==="img") return `(이미지) ${b.url}`;
    return (b.runs||[]).map(r=>r.text).join("");
  }).join("\n\n");
}
// 방법 1: 서식째 복사 → 새 구글 문서에 붙여넣기 (설정 필요 없음)
async function copyForGoogleDocs(mode){
  const a=active(), model=buildDocModel(a,mode), html=renderDocHtml(model,a.title);
  let ok=false;
  try{
    await navigator.clipboard.write([new ClipboardItem({
      "text/html":new Blob([html],{type:"text/html"}),
      "text/plain":new Blob([modelToPlain(model)],{type:"text/plain"})
    })]); ok=true;
  }catch(e){
    // 구형 브라우저: 화면 밖 영역을 선택해서 복사
    const box=document.createElement("div"); box.contentEditable="true"; box.style.cssText="position:fixed;left:-9999px;top:0;background:#fff;color:#000";
    box.innerHTML=html.replace(/^[\s\S]*<body[^>]*>|<\/body>[\s\S]*$/g,""); document.body.appendChild(box);
    const r=document.createRange(); r.selectNodeContents(box); const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    try{ ok=document.execCommand("copy"); }catch(_){} sel.removeAllRanges(); box.remove();
  }
  if(!ok){ showToast("복사에 실패했어. 브라우저 권한을 확인해 줘."); return; }
  const w=IS_APP?openExternal("https://docs.new"):window.open("https://docs.new","_blank");
  if(w) showToast("복사됨 · 새 구글 문서가 열리면 Ctrl+V (휴대폰은 길게 눌러 붙여넣기)",null,null,7000);
  else showToast("복사됨 · 새 구글 문서를 열고 Ctrl+V","새 문서 열기",()=>openExternal("https://docs.new"),9000);
}
// 방법 2: 구글 드라이브에 바로 만들기 (GOOGLE_CLIENT_ID 필요)
let _gTokenClient=null, _gToken=null, _gTokenExp=0, _gPending=null;
function prepareGoogleUpload(){
  if(!GOOGLE_CLIENT_ID||_gTokenClient) return;
  loadScript("https://accounts.google.com/gsi/client").then(()=>{
    _gTokenClient=google.accounts.oauth2.initTokenClient({ client_id:GOOGLE_CLIENT_ID, scope:"https://www.googleapis.com/auth/drive.file",
      callback:resp=>{ const p=_gPending; _gPending=null; if(!p) return;
        if(resp.error){ p.rej(resp); return; }
        _gToken=resp.access_token; _gTokenExp=Date.now()+(resp.expires_in||3000)*1000-60000; p.res(_gToken); } });
  }).catch(()=>{});
}
function getGoogleToken(){
  if(_gToken&&Date.now()<_gTokenExp) return Promise.resolve(_gToken);
  if(!_gTokenClient) return Promise.reject(new Error("구글 로그인 준비 중이야. 잠시 뒤 다시 눌러 줘."));
  return new Promise((res,rej)=>{ _gPending={res,rej}; _gTokenClient.requestAccessToken(); });   // 클릭 직후 바로 호출해야 팝업이 안 막힘
}
async function uploadToGoogleDocs(mode){
  let token;
  try{ token=await getGoogleToken(); }catch(e){ showToast(e.message||"구글 로그인을 취소했어."); return; }
  const a=active(), html=renderDocHtml(buildDocModel(a,mode),a.title);
  const name=(a.title||"시나리오")+(mode==="player"?" (플레이어용)":"");
  const bd="casefile"+Date.now();
  const body=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,mimeType:"application/vnd.google-apps.document"})}\r\n--${bd}\r\nContent-Type: text/html; charset=UTF-8\r\n\r\n${html}\r\n--${bd}--`;
  showToast("구글 드라이브에 올리는 중…",null,null,2500);
  try{
    const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink",
      {method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"multipart/related; boundary="+bd},body});
    const j=await r.json();
    if(!r.ok) throw new Error((j.error&&j.error.message)||r.status);
    showToast(`구글 문서 "${name}" 만들었어.`,"열기",()=>openExternal(j.webViewLink),12000);
  }catch(e){ if(String(e.message).includes("401")) _gToken=null; showToast("올리기 실패: "+e.message); }
}

let _printOpened=[];
function preparePrint(){
  _printOpened=[];
  document.querySelectorAll("details.ms-kp:not([open])").forEach(d=>{ const t=d.querySelector("textarea"); if(t&&t.value.trim()){ d.open=true; _printOpened.push(d); } });
  document.querySelectorAll(".roll-res.collapsed").forEach(r=>{ r.classList.remove("collapsed"); r.dataset.printOpened="1"; });
  sizeAllGrows();
}
// 인쇄: 웹·윈도우는 브라우저 인쇄, 안드로이드는 시스템 인쇄 창 (PDF로 저장 가능)
let _printRestoreTimer=null, _printResumeHooked=false;
async function appPrint(){
  if(!IS_ANDROID){ window.print(); return; }
  preparePrint();
  if(!_printResumeHooked){ _printResumeHooked=true;
    try{ nativePlugin("App").addListener("resume",()=>{ if(_printRestoreTimer){ clearTimeout(_printRestoreTimer); _printRestoreTimer=null; setTimeout(restorePrint,600); } }); }catch(e){} }
  try{ await nativePlugin("CaseFilePrint").print({name:safeName((active()&&active().title)||"CASE FILE")}); }
  catch(e){ restorePrint(); showToast("인쇄 창을 열지 못했어."); return; }
  clearTimeout(_printRestoreTimer); _printRestoreTimer=setTimeout(()=>{ _printRestoreTimer=null; restorePrint(); },180000);
}
function restorePrint(){
  _printOpened.forEach(d=>d.open=false); _printOpened=[];
  document.querySelectorAll('.roll-res[data-print-opened="1"]').forEach(r=>{ r.classList.add("collapsed"); delete r.dataset.printOpened; });
}

/* ===== 버전 기록 ===== */
const SNAP_GAP=30*60*1000, SNAP_KEEP=40;
let versionsOff=false;
function lastSnapTs(id){ try{ return +localStorage.getItem("coc:snap:"+id)||0; }catch(e){ return 0; } }
async function saveSnapshot(id,kind){
  const s=state.scenarios[id]; if(!s||!currentUser||versionsOff) return false;
  const {error}=await sb.from("scenario_versions").insert([{scenario_id:id,user_id:currentUser.id,title:s.title||"",
    chars:scenarioCounts(s).withSp,kind:kind||"auto",data:JSON.parse(JSON.stringify(s))}]);
  if(error){ console.warn("스냅샷 실패",error); if(kind==="auto") versionsOff=true; return false; }
  try{ localStorage.setItem("coc:snap:"+id,String(Date.now())); }catch(e){}
  pruneSnapshots(id); return true;
}
async function pruneSnapshots(id){
  try{
    const {data}=await sb.from("scenario_versions").select("id").eq("scenario_id",id).eq("kind","auto")
      .order("created_at",{ascending:false}).range(SNAP_KEEP,SNAP_KEEP+200);
    if(data&&data.length) await sb.from("scenario_versions").delete().in("id",data.map(x=>x.id));
  }catch(e){}
}
function maybeSnapshot(id){ if(!versionsOff && Date.now()-lastSnapTs(id)>SNAP_GAP) saveSnapshot(id,"auto"); }
async function openVersionModal(){
  const a=active(), modal=document.getElementById("versionModal"), body=document.getElementById("versionBody");
  modal.classList.add("open"); body.innerHTML="로드 중…";
  const {data,error}=await sb.from("scenario_versions").select("id,created_at,chars,kind,title")
    .eq("scenario_id",a.id).order("created_at",{ascending:false}).limit(80);
  if(error){ body.innerHTML=`<div style="color:var(--danger);padding:16px;line-height:1.6">버전 기록을 불러오지 못했어.<br><span style="color:var(--faint)">Supabase에서 migration-3 SQL을 실행했는지 확인해 줘.</span></div>`; return; }
  const KIND={auto:"자동",manual:"직접 저장","before-restore":"복원 전"};
  const list=(data||[]).map(v=>{ const d=new Date(v.created_at);
    return `<div class="ver-item"><span class="vi-date">${d.toLocaleDateString("ko-KR")} ${d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
      <span class="ver-kind ${v.kind!=='auto'?'manual':''}">${KIND[v.kind]||v.kind}</span>
      <span class="vi-meta">${fmtN(v.chars||0)}자</span>
      <button class="li-btn" data-verrestore="${v.id}">복원</button></div>`; }).join("");
  body.innerHTML=`<div class="ver-top"><div class="hint">저장할 때 30분 간격으로 자동 보관돼 (최근 ${SNAP_KEEP}개). 큰 수정 전엔 직접 저장해 둬.</div>
    <button class="li-btn" id="verSaveNow">지금 저장</button></div>
    ${list||'<div style="color:var(--faint);text-align:center;padding:24px;font-family:var(--serif)">아직 저장된 버전이 없어.</div>'}`;
  on("verSaveNow","click",async()=>{ await flushSaves(); const ok=await saveSnapshot(a.id,"manual"); showToast(ok?"현재 상태를 버전으로 저장했어.":"저장 실패"); openVersionModal(); });
  body.querySelectorAll("[data-verrestore]").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("이 버전으로 되돌릴까? 지금 상태는 '복원 전' 버전으로 따로 보관돼.")) return;
    const {data:row,error:e2}=await sb.from("scenario_versions").select("data").eq("id",b.dataset.verrestore).maybeSingle();
    if(e2||!row){ showToast("버전을 불러오지 못했어."); return; }
    await flushSaves();
    await saveSnapshot(a.id,"before-restore");
    undoPush("버전 복원",a.id);
    const cur=state.scenarios[a.id];
    const restored=migrate(Object.assign(row.data||{},{id:a.id,is_public:cur.is_public,share_id:cur.share_id}));
    state.scenarios[a.id]=restored; dirtyIds.add(a.id); syncSoon();
    modal.classList.remove("open"); render();
    showToast("버전을 복원했어.","실행취소",undoPop);
  }));
}

/* ===== Judgment ===== */
let judge={ mode:"skill", skill:50, bonus:0, penalty:0, skillB:50, bonusB:0, penaltyB:0, san:50, lossOk:"0", lossFail:"1D6",
  mod:0, esc:0, dc:15, adv:"none", stat:1, dmgExpr:"1d8",
  dxDice:5, dxCrit:10, dxMod:0, dxEnc:0, dxTarget:"", inDc:5 };
function bpFields(prefix,kB,kP,vB,vP){
  return `<div class="row2">
    <div class="field"><label>${prefix}보너스</label><div class="stepper"><button data-step="${kB}" data-d="-1">−</button><span class="num" id="num-${kB}">${vB}</span><button data-step="${kB}" data-d="1">+</button></div></div>
    <div class="field"><label>${prefix}페널티</label><div class="stepper"><button data-step="${kP}" data-d="-1">−</button><span class="num" id="num-${kP}">${vP}</span><button data-step="${kP}" data-d="1">+</button></div></div>
  </div>`;
}
function renderJudgeCoc(main){
  const M=judge.mode;
  const seg=(id,label)=>`<button data-mode="${id}" class="${M===id?'on':''}">${label}</button>`;
  let fields="";
  if(M==="skill"){
    fields=`<div class="field"><label>기능치 / 능력치</label><input class="inp" id="j_skill" type="number" min="0" max="100" value="${judge.skill}" /></div>
      ${bpFields("","bonus","penalty",judge.bonus,judge.penalty)}
      <div class="thresh">
        <div class="tc"><div class="tl">어려움 (½)</div><div class="tv" id="t_hard">—</div></div>
        <div class="tc"><div class="tl">극단 (⅕)</div><div class="tv" id="t_ext">—</div></div>
        <div class="tc"><div class="tl">대실패</div><div class="tv" id="t_fum">—</div></div>
      </div>`;
  } else if(M==="opposed"){
    fields=`<div class="row2">
        <div class="field"><label>탐사자 (A)</label><input class="inp" id="j_skill" type="number" min="0" max="100" value="${judge.skill}" /></div>
        <div class="field"><label>상대 (B)</label><input class="inp" id="j_skillB" type="number" min="0" max="100" value="${judge.skillB}" /></div>
      </div>
      <div class="row2"><div>${bpFields("A ","bonus","penalty",judge.bonus,judge.penalty)}</div><div>${bpFields("B ","bonusB","penaltyB",judge.bonusB,judge.penaltyB)}</div></div>`;
  } else {
    fields=`<div class="field"><label>현재 SAN</label><input class="inp" id="j_san" type="number" min="0" max="99" value="${judge.san}" /></div>
      <div class="row2">
        <div class="field"><label>성공 시 손실</label><input class="inp" id="j_lossok" value="${esc(judge.lossOk)}" placeholder="0 / 1" /></div>
        <div class="field"><label>실패 시 손실</label><input class="inp" id="j_lossfail" value="${esc(judge.lossFail)}" placeholder="1D6 / 1D4+1" /></div>
      </div>
      <div class="hint">예: 0/1D6, 1/1D8, 1D3/1D20. 주사위는 D 표기. 굴릴 때마다 남은 SAN이 갱신돼.</div>`;
  }
  main.innerHTML=`<div class="scroll"><div class="pad calcwrap">
    <h1 class="secttl">판정</h1>
    <p class="secsub">CoC 7판 · 기능 판정 · 대항 판정 · SAN 체크.</p>
    <div class="board-bar"><div class="viewswitch">${seg("skill","기능 판정")}${seg("opposed","대항")}${seg("san","SAN 체크")}</div></div>
    <div class="calcface">
      ${fields}
      <div class="dieout"><div class="val" id="j_val">··</div><div class="lvl" id="j_lvl">굴려봐</div><div class="sub" id="j_sub"></div></div>
      <button class="rollbtn" id="j_roll">${M==="san"?"SAN 체크":M==="opposed"?"양측 굴리기":"d100 굴리기"}</button>
    </div>
    <div class="rolllog" id="j_log"></div>
  </div></div>`;
  main.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{ judge.mode=b.dataset.mode; renderJudge(main); }));
  main.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.step; judge[k]=clamp(judge[k]+parseInt(b.dataset.d,10),0,5); setText("num-"+k,judge[k]); }));
  if(M==="skill"){ bind("j_skill","input",v=>{ judge.skill=clamp(parseInt(v||"0",10),0,100); updateThresh(); }); updateThresh(); }
  if(M==="opposed"){ bind("j_skill","input",v=>judge.skill=clamp(parseInt(v||"0",10),0,100)); bind("j_skillB","input",v=>judge.skillB=clamp(parseInt(v||"0",10),0,100)); }
  if(M==="san"){ bind("j_san","input",v=>judge.san=clamp(parseInt(v||"0",10),0,99)); bind("j_lossok","input",v=>judge.lossOk=v); bind("j_lossfail","input",v=>judge.lossFail=v); }
  on("j_roll","click",()=>{ if(judge.mode==="skill") rollSkill(); else if(judge.mode==="opposed") rollOpposed(); else rollSan(); });
}
function updateThresh(){ const s=judge.skill; setText("t_hard",Math.floor(s/2)); setText("t_ext",Math.floor(s/5)); setText("t_fum",s<50?"96–00":"100"); }
function showDie(val,cls,label,sub){
  const v=document.getElementById("j_val"); v.textContent=val; v.style.fontSize=val.length>3?"40px":"";
  const lvl=document.getElementById("j_lvl"); lvl.className="lvl "+cls; lvl.textContent=label;
  setText("j_sub",sub);
}
function logRoll(r,ctx,label,cls){
  const log=document.getElementById("j_log");
  const col=cls==="fumble"?"danger":(cls==="s5"||cls==="s4")?"clue":"dim";
  const row=document.createElement("div"); row.className="lg";
  row.innerHTML=`<span class="r">${r}</span><span>${esc(ctx)}</span><span class="ll" style="color:var(--${col})">${esc(label)}</span>`;
  log.prepend(row); while(log.children.length>8) log.lastChild.remove();
}
function rollSkill(){
  const r=rollPct(judge.bonus,judge.penalty), lv=levelOf(r,judge.skill), d=r===100?"00":String(r).padStart(2,"0");
  showDie(d,lv.cls,lv.label,`목표 ${judge.skill} · 굴림 ${r}`); logRoll(d,`기능 ${judge.skill}`,lv.label,lv.cls);
}
function rollOpposed(){
  const ra=rollPct(judge.bonus,judge.penalty), la=levelOf(ra,judge.skill);
  const rb=rollPct(judge.bonusB,judge.penaltyB), lb=levelOf(rb,judge.skillB);
  let winner,cls;
  if(la.rank>lb.rank){ winner="A 우세"; cls="s3"; }
  else if(lb.rank>la.rank){ winner="B 우세"; cls="fail"; }
  else if(judge.skill>judge.skillB){ winner="A 우세 (기능 우위)"; cls="s3"; }
  else if(judge.skillB>judge.skill){ winner="B 우세 (기능 우위)"; cls="fail"; }
  else { winner="무승부"; cls="s2"; }
  showDie(`${ra} : ${rb}`,cls,winner,`A ${judge.skill}(${la.label}) vs B ${judge.skillB}(${lb.label})`);
  logRoll(`${ra}:${rb}`,`대항 ${judge.skill}/${judge.skillB}`,winner,cls);
}
function rollSan(){
  const r=rollPct(0,0), success=r<=judge.san;
  const loss=success?rollDice(judge.lossOk):rollDice(judge.lossFail);
  const before=judge.san, remain=Math.max(0,before-loss), big=loss>=5, d=r===100?"00":String(r).padStart(2,"0");
  showDie(d,success?"s2":"fumble",`${success?"성공":"실패"} · SAN −${loss}`,`${before} → ${remain}${big?" · 일시적 광기 체크 (5+ 손실)":""}`);
  judge.san=remain; const inp=document.getElementById("j_san"); if(inp) inp.value=remain;
  logRoll(d,`SAN ${before}→${remain}`,`−${loss}${big?" 광기":""}`,success?"s2":"fumble");
}

/* ===== Judge dispatcher (per system) ===== */
function renderJudge(main){
  const id=(active().system)||"coc7";
  const allowed={coc7:["skill","opposed","san"],age13:["d20","dmg"],dnd5:["d20","dmg"],pbta:["roll"],dx:["roll","dmg"],insane:["roll"],custom:["roll"]}[id]||["skill"];
  if(!allowed.includes(judge.mode)) judge.mode=allowed[0];
  if(id==="coc7") renderJudgeCoc(main);
  else if(id==="age13") renderJudge13(main);
  else if(id==="dnd5") renderJudge5e(main);
  else if(id==="pbta") renderJudgePbta(main);
  else if(id==="dx") renderJudgeDX(main);
  else if(id==="insane") renderJudgeInsane(main);
  else renderJudgeCustom(main);
}
function judgeShell(main,subtitle,modesHtml,fieldsHtml,rollLabel){
  main.innerHTML=`<div class="scroll"><div class="pad calcwrap">
    <h1 class="secttl">판정</h1>
    <p class="secsub">${subtitle}</p>
    ${modesHtml?`<div class="board-bar"><div class="viewswitch">${modesHtml}</div></div>`:""}
    <div class="calcface">${fieldsHtml}
      <div class="dieout"><div class="val" id="j_val">··</div><div class="lvl" id="j_lvl">굴려봐</div><div class="sub" id="j_sub"></div></div>
      <button class="rollbtn" id="j_roll">${rollLabel}</button>
    </div>
    <div class="rolllog" id="j_log"></div>
  </div></div>`;
  main.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{ judge.mode=b.dataset.mode; renderJudge(main); }));
  main.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.step, lim=k==="esc"?6:5; judge[k]=clamp(judge[k]+parseInt(b.dataset.d,10),0,lim); setText("num-"+k,judge[k]); }));
}
function modeSeg(modes){ return modes.map(([id,label])=>`<button data-mode="${id}" class="${judge.mode===id?'on':''}">${label}</button>`).join(""); }
function numField(label,id,val,extra){ return `<div class="field"><label>${label}</label><input class="inp" id="${id}" type="number" value="${val}" ${extra||""} /></div>`; }
function stepField(label,key){ return `<div class="field"><label>${label}</label><div class="stepper"><button data-step="${key}" data-d="-1">−</button><span class="num" id="num-${key}">${judge[key]}</span><button data-step="${key}" data-d="1">+</button></div></div>`; }
function dmgFields(){ return `<div class="field"><label>피해 주사위</label><input class="inp" id="j_dmg" value="${esc(judge.dmgExpr)}" placeholder="예: 2d8+4, 1d12" /></div><div class="hint">D 표기로 입력. 합계를 굴려줘.</div>`; }
function bindDmg(){ bind("j_dmg","input",v=>judge.dmgExpr=v); }
function rollDmg(){ const t=rollDice(judge.dmgExpr); showDie(String(t),"s2","피해",`${judge.dmgExpr} = ${t}`); logRoll(String(t),`피해 ${judge.dmgExpr}`,"−"+t,"dim"); }

/* 제13시대 (13th Age) */
function renderJudge13(main){
  const modes=modeSeg([["d20","d20 판정"],["dmg","피해"]]);
  let fields;
  if(judge.mode==="d20"){
    fields=`${numField("보정 (능력+레벨 등)","j_mod",judge.mod)}
      <div class="row2">${stepField("상승 주사위","esc")}${numField("목표 / 난이도","j_dc",judge.dc,'min="0"')}</div>
      <div class="hint">d20 + 보정 + 상승. 자연 20 = 크리티컬, 자연 1 = 자동 실패. 상승 주사위는 2라운드에 1, 매 라운드 +1(최대 6).</div>`;
  } else fields=dmgFields();
  judgeShell(main,"제13시대 · d20 판정 · 피해 굴림",modes,fields,judge.mode==="dmg"?"피해 굴리기":"d20 굴리기");
  if(judge.mode==="d20"){ bind("j_mod","input",v=>judge.mod=parseInt(v||"0",10)); bind("j_dc","input",v=>judge.dc=clamp(parseInt(v||"0",10),0,99)); on("j_roll","click",roll13); }
  else { bindDmg(); on("j_roll","click",rollDmg); }
}
function roll13(){
  const nat=rollD20(), total=nat+judge.mod+judge.esc;
  let cls,label;
  if(nat===20){ cls="s5"; label="대성공 · 크리티컬"; }
  else if(nat===1){ cls="fumble"; label="대실패"; }
  else if(total>=judge.dc){ cls="s2"; label="성공"; }
  else { cls="fail"; label="실패"; }
  showDie(String(total),cls,label,`d20(${nat}) ${sign(judge.mod)}${judge.esc?` 상승+${judge.esc}`:""} = ${total} vs ${judge.dc}`);
  logRoll(String(total),`d20 vs ${judge.dc}`,label,cls);
}

/* D&D 5판 */
function renderJudge5e(main){
  const modes=modeSeg([["d20","d20 판정"],["dmg","피해"]]);
  let fields;
  if(judge.mode==="d20"){
    const seg=`<div class="statusseg" id="j_adv">
      <button data-adv="none" class="${judge.adv==='none'?'on':''}">일반</button>
      <button data-adv="adv" class="${judge.adv==='adv'?'on':''}">유리</button>
      <button data-adv="dis" class="${judge.adv==='dis'?'on':''}">불리</button></div>`;
    fields=`${numField("보정 (능력+숙련)","j_mod",judge.mod)}
      <div class="field"><label>굴림 방식</label>${seg}</div>
      ${numField("목표 (DC / AC)","j_dc",judge.dc,'min="0"')}
      <div class="hint">d20 + 보정 vs DC. 자연 20 = 대성공, 자연 1 = 대실패. 유리·불리는 d20 두 개 중 높은/낮은 값.</div>`;
  } else fields=dmgFields();
  judgeShell(main,"D&D 5판 · d20 판정 · 피해 굴림",modes,fields,judge.mode==="dmg"?"피해 굴리기":"d20 굴리기");
  if(judge.mode==="d20"){
    bind("j_mod","input",v=>judge.mod=parseInt(v||"0",10)); bind("j_dc","input",v=>judge.dc=clamp(parseInt(v||"0",10),0,99));
    document.getElementById("j_adv").querySelectorAll("[data-adv]").forEach(b=>b.addEventListener("click",()=>{ judge.adv=b.dataset.adv; document.querySelectorAll("#j_adv [data-adv]").forEach(x=>x.classList.remove("on")); b.classList.add("on"); }));
    on("j_roll","click",roll5e);
  } else { bindDmg(); on("j_roll","click",rollDmg); }
}
function roll5e(){
  let nat,note="";
  if(judge.adv==="adv"){ const a=rollD20(),b=rollD20(); nat=Math.max(a,b); note=` 유리(${a},${b})`; }
  else if(judge.adv==="dis"){ const a=rollD20(),b=rollD20(); nat=Math.min(a,b); note=` 불리(${a},${b})`; }
  else nat=rollD20();
  const total=nat+judge.mod;
  let cls,label;
  if(nat===20){ cls="s5"; label="대성공 (자연 20)"; }
  else if(nat===1){ cls="fumble"; label="대실패 (자연 1)"; }
  else if(total>=judge.dc){ cls="s2"; label="성공"; }
  else { cls="fail"; label="실패"; }
  showDie(String(total),cls,label,`d20(${nat})${note} ${sign(judge.mod)} = ${total} vs ${judge.dc}`);
  logRoll(String(total),`d20 vs ${judge.dc}`,label,cls);
}

/* 던전월드 (PbtA) */
function renderJudgePbta(main){
  const fields=`${numField("스탯 보정","j_stat",judge.stat)}
    <div class="hint">2d6 + 스탯. 10+ 완전 성공 · 7–9 부분 성공 · 6 이하 실패.</div>`;
  judgeShell(main,"던전월드 · 2d6 + 스탯",null,fields,"2d6 굴리기");
  bind("j_stat","input",v=>judge.stat=parseInt(v||"0",10)); on("j_roll","click",rollPbta);
}
function rollPbta(){
  const d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6), total=d1+d2+judge.stat;
  let cls,label;
  if(total>=10){ cls="s4"; label="완전 성공"; }
  else if(total>=7){ cls="s3"; label="부분 성공 (대가)"; }
  else { cls="fail"; label="실패 (GM의 수)"; }

  logRoll(String(total),`2d6${sign(judge.stat)}`,label,cls);
}

/* 더블크로스 3rd */
function renderJudgeDX(main){
  const modes=modeSeg([["roll","행위 판정"],["dmg","피해"]]);
  let fields;
  if(judge.mode==="roll"){
    fields=`<div class="row2">${numField("주사위 (능력+기능)","j_dxd",judge.dxDice,'min="0"')}${numField("크리티컬 값","j_dxc",judge.dxCrit,'min="2" max="10"')}</div>
      <div class="row2">${numField("고정값 (수정)","j_dxm",judge.dxMod)}${numField("침식률 %","j_dxe",judge.dxEnc,'min="0"')}</div>
      ${numField("목표값 (선택)","j_dxt",judge.dxTarget===""?"":judge.dxTarget,'min="0"')}
      <div class="hint">크리티컬 값 이상은 다시 굴려 +10. 달성치 = 크리티컬 라운드×10 + 최종 최고눈 + 고정값. 침식률 60/80/100%에 주사위 +1/+2/+3.</div>`;
  } else fields=dmgFields();
  judgeShell(main,"더블크로스 3rd · d10 풀 · 달성치",modes,fields,judge.mode==="dmg"?"피해 굴리기":"판정 굴리기");
  if(judge.mode==="roll"){
    bind("j_dxd","input",v=>judge.dxDice=clamp(parseInt(v||"0",10),0,99));
    bind("j_dxc","input",v=>judge.dxCrit=clamp(parseInt(v||"10",10),2,10));
    bind("j_dxm","input",v=>judge.dxMod=parseInt(v||"0",10));
    bind("j_dxe","input",v=>judge.dxEnc=clamp(parseInt(v||"0",10),0,999));
    bind("j_dxt","input",v=>judge.dxTarget=v.trim()===""?"":clamp(parseInt(v||"0",10),0,9999));
    on("j_roll","click",rollDX);
  } else { bindDmg(); on("j_roll","click",rollDmg); }
}
function rollDX(){
  const crit=clamp(judge.dxCrit,2,10), bonus=judge.dxEnc>=100?3:judge.dxEnc>=80?2:judge.dxEnc>=60?1:0;
  let cur=Math.max(1,judge.dxDice+bonus), rounds=0, highest=0, first=null, guard=0;
  while(guard++<50){
    const dice=[]; for(let i=0;i<cur;i++) dice.push(1+Math.floor(Math.random()*10));
    if(first===null) first=dice.slice();
    const crits=dice.filter(d=>d>=crit).length;
    if(crits>0){ rounds++; cur=crits; } else { highest=Math.max(...dice); break; }
  }
  const ach=rounds*10+highest+judge.dxMod, fumble=first.length>0&&first.every(d=>d===1), hasT=judge.dxTarget!==""&&judge.dxTarget!=null;
  const extra=rounds>0?` · 크리티컬 ${rounds}회`:"";
  let cls,label;
  if(fumble){ cls="fumble"; label="펌블"; }
  else if(hasT){ const ok=ach>=judge.dxTarget; cls=ok?(rounds>0?"s4":"s2"):"fail"; label=(ok?"성공":"실패")+extra; }
  else { cls=rounds>0?"s4":"s2"; label="달성치 "+ach+extra; }
  showDie(String(ach),cls,label,`${judge.dxDice}${bonus?`+${bonus}침식`:""}D10 C${crit}${judge.dxMod?sign(judge.dxMod):""} → ${ach}${hasT?` vs ${judge.dxTarget}`:""}`);
  logRoll(String(ach),`더블크로스 C${crit}`,label,cls);
}

/* ===== Stat block helpers ===== */
const CHAR_KEYS=["STR","CON","SIZ","DEX","INT","POW","APP","EDU"];
function numOr(v){ const n=parseInt(v,10); return isNaN(n)?null:n; }
function dbBuild(t){
  const table=[[64,"-2",-2],[84,"-1",-1],[124,"0",0],[164,"+1D4",1],[204,"+1D6",2],[284,"+2D6",3],[364,"+3D6",4],[444,"+4D6",5],[524,"+5D6",6]];
  for(const [max,db,build] of table){ if(t<=max) return {db,build}; }
  return {db:"+6D6",build:7};
}
function deriveSB(sb){
  const C=numOr(sb.CON),S=numOr(sb.SIZ),P=numOr(sb.POW),Str=numOr(sb.STR);
  const hp=(C!=null&&S!=null)?Math.floor((C+S)/10):null;
  const mp=(P!=null)?Math.floor(P/5):null;
  const san=(P!=null)?P:null;
  let db=null,build=null;
  if(Str!=null&&S!=null){ const r=dbBuild(Str+S); db=r.db; build=r.build; }
  return {hp,mp,san,db,build};
}

/* ===== Dice / success-level helpers ===== */
function sign(n){ return n>=0?"+"+n:String(n); }
function rollD20(){ return 1+Math.floor(Math.random()*20); }
function deriveCoc(sb){ const d=deriveSB(sb); return [{label:"HP",value:d.hp},{label:"MP",value:d.mp},{label:"SAN",value:d.san},{label:"DB",value:d.db},{label:"빌드",value:d.build}]; }
function dnd5Mod(v){ const n=numOr(v); return n==null?null:Math.floor((n-10)/2); }
function derive5e(sb){ return ["STR","DEX","CON","INT","WIS","CHA"].map(k=>{ const m=dnd5Mod(sb[k]); return {label:k,value:m==null?null:sign(m)}; }); }

function rollDice(expr){
  expr=String(expr==null?"0":expr).toUpperCase().replace(/\s/g,"");
  if(expr===""||expr==="0") return 0;
  let total=0;
  for(const p of expr.split("+")){
    const m=p.match(/^(\d*)D(\d+)$/);
    if(m){ const n=parseInt(m[1]||"1",10), s=parseInt(m[2],10); for(let i=0;i<n;i++) total+=1+Math.floor(Math.random()*s); }
    else { const k=parseInt(p,10); if(!isNaN(k)) total+=k; }
  }
  return total;
}
function rollPct(bonus,penalty){
  const units=Math.floor(Math.random()*10), dir=(bonus||0)-(penalty||0);
  let tens=[Math.floor(Math.random()*10)];
  for(let i=0;i<Math.abs(dir);i++) tens.push(Math.floor(Math.random()*10));
  let tv=dir>0?Math.min(...tens):dir<0?Math.max(...tens):tens[0];
  let r=tv*10+units; if(r===0) r=100; return r;
}
function levelOf(roll,skill){
  if(roll===1) return {cls:"s5",label:"대성공",rank:5};
  if((skill<50&&roll>=96)||roll===100) return {cls:"fumble",label:"대실패",rank:0};
  if(roll<=Math.floor(skill/5)) return {cls:"s4",label:"극단적 성공",rank:4};
  if(roll<=Math.floor(skill/2)) return {cls:"s3",label:"어려운 성공",rank:3};
  if(roll<=skill) return {cls:"s2",label:"보통 성공",rank:2};
  return {cls:"fail",label:"실패",rank:1};
}

/* ===== Play mode panel ===== */
function trackerStats(sys){
  return {coc7:['HP','SAN','MP'],age13:['HP','회복'],dnd5:['HP','히트 다이스'],pbta:['HP'],dx:['HP','침식'],insane:['생명력','이성'],custom:['HP']}[sys]||['HP'];
}
function updatePlayPanel(a){
  const panel=document.getElementById("playPanel"); if(!panel) return;
  if(!a._play) a._play={currentSceneId:null,trackers:{},revealed:[],rolls:[]};
  const p=a._play, s=a.scenes.find(x=>x.id===p.currentSceneId);
  const stats=trackerStats(a.system);
  let html="";
  if(s){
    const nexts=a.edges.filter(e=>e.from===s.id).map(e=>{const t=a.scenes.find(x=>x.id===e.to);return t?`<button class="play-next-btn" data-goto="${t.id}">${esc(t.title||"제목 없음")}</button>`:""}).join("");
    html+=`<div class="play-block"><div class="play-block-h">현재 씬</div>
      <div class="play-scene-title">${esc(s.title||"제목 없는 씬")}</div>
      ${s.readAloud?`<div class="play-read">${esc(s.readAloud).replace(/\n/g,"<br>")}</div>`:``}
    </div>`;
    if(nexts) html+=`<div class="play-block"><div class="play-block-h">다음 씬으로</div>${nexts}</div>`;
  } else { html+=`<div class="play-ph">씬을 클릭해 현재 씬으로 설정해.</div>`; }
  // HUD
  html+=`<div class="play-block"><div class="play-block-h">참여자 트래커</div></div><div class="play-hud" id="playHud">`;
  Object.entries(p.trackers||{}).forEach(([tid,tr])=>{
    html+=`<div class="tracker-row" data-tid="${tid}"><span class="tracker-name">${esc(tr.name||"참여자")}</span>`;
    stats.forEach(stat=>{
      const v=(tr[stat]!=null?tr[stat]:10);
      html+=`<div class="tracker-stat"><span>${esc(stat)}</span><div class="tracker-val"><button data-tmod="${tid}|${stat}|-1">−</button><span class="v" id="tv-${tid}-${stat}">${v}</span><button data-tmod="${tid}|${stat}|1">+</button></div></div>`;
    });
    html+=`<button class="tracker-del" data-tdel="${tid}">×</button></div>`;
  });
  html+=`<button class="add-participant" id="addParticipant">+ 참여자 추가</button></div>`;
  // Handouts
  if(a.handouts&&a.handouts.length){
    html+=`<div class="play-block"><div class="play-block-h">핸드아웃 공개</div>`;
    a.handouts.forEach(h=>{ const on=p.revealed&&p.revealed.includes(h.id);
      html+=`<div class="ho-row"><span>${esc(h.title||"핸드아웃")}</span><button class="ho-reveal-btn ${on?'on':''}" data-hoid="${h.id}">${on?"공개됨":"공개"}</button></div>`; });
    html+=`</div>`;
  }
  panel.innerHTML=html;
  panel.querySelectorAll("[data-tmod]").forEach(b=>b.addEventListener("click",()=>{
    const [tid,stat,d]=b.dataset.tmod.split("|"); if(!p.trackers[tid]) return;
    p.trackers[tid][stat]=(p.trackers[tid][stat]||0)+parseInt(d);
    const v=document.getElementById(`tv-${tid}-${stat}`); if(v) v.textContent=p.trackers[tid][stat];
    syncSoon();
  }));
  panel.querySelectorAll("[data-tdel]").forEach(b=>b.addEventListener("click",()=>{
    delete p.trackers[b.dataset.tdel]; updatePlayPanel(a); syncSoon();
  }));
  panel.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>{
    p.currentSceneId=b.dataset.goto; updatePlayPanel(a);
    fcRenderNodes(a); fcHighlightSel(a); syncSoon();
  }));
  panel.querySelectorAll("[data-hoid]").forEach(b=>b.addEventListener("click",()=>{
    if(!p.revealed) p.revealed=[];
    const i=p.revealed.indexOf(b.dataset.hoid);
    if(i>=0) p.revealed.splice(i,1); else p.revealed.push(b.dataset.hoid);
    updatePlayPanel(a); syncSoon();
  }));
  on("addParticipant","click",()=>{
    const name=prompt("참여자 이름 (PC 또는 NPC)"); if(!name) return;
    const tid=uid("pt"); const tr={name,rolls:[]}; stats.forEach(st=>{ tr[st]=10; });
    p.trackers[tid]=tr; updatePlayPanel(a); syncSoon();
  });
}
