<script>
"use strict";

/* ===== Supabase ===== */
const SUPABASE_URL="https://whnicoquprnwbtihwmkk.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indobmljb3F1cHJud2J0aWh3bWtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzA5NTcsImV4cCI6MjA5NzYwNjk1N30.pi5SGNwQWh46kN_w4JjH9JMQtD4xHBC0YG-3BrpIz4E";
const sb=supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LEGACY_KEY="coc:workspace";   // 옛 window.storage 데이터 (이전용)
const LAST_KEY="coc:lastActive";    // 기기별 마지막 연 시나리오
let currentUser=null;

/* ===== 앱 환경 (안드로이드 · 윈도우) =====
   같은 index.html이 웹·안드로이드 앱·윈도우 앱에서 모두 돌아가. 아래는 앱 안에서만 달라지는 부분. */
// 웹 버전 주소. 앱에서 만든 공유 링크와 비밀번호 재설정 메일이 이 주소로 열려.
// 깃허브 자동 빌드가 채워 넣어 (scripts/prepare-www.mjs). 웹에서는 비워 둬도 돼.
const WEB_URL="";
const IS_NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const IS_ANDROID=IS_NATIVE&&window.Capacitor.getPlatform()==="android";
const IS_DESKTOP=!!window.casefileDesktop;
const IS_APP=IS_NATIVE||IS_DESKTOP;
const _nativePlugins={};
function nativePlugin(name){
  if(!IS_NATIVE) return null;
  if(!_nativePlugins[name]) _nativePlugins[name]=window.Capacitor.registerPlugin(name);
  return _nativePlugins[name];
}
// 공유 링크·메일 링크의 기준 주소
function webBase(){
  if(IS_APP) return WEB_URL?WEB_URL.replace(/\/?$/,"/"):"";
  return location.origin+location.pathname;
}
function shareUrl(id){ const b=webBase(); return b?b+"?share="+id:""; }
// 외부 주소는 앱 밖(기본 브라우저)에서 연다
function openExternal(url){
  if(!url) return false;
  if(IS_DESKTOP){ window.casefileDesktop.openExternal(url); return true; }
  if(IS_NATIVE){ nativePlugin("Browser").open({url}).catch(()=>{ location.href=url; }); return true; }
  return !!window.open(url,"_blank","noopener");
}
if(IS_APP){
  document.documentElement.classList.add("is-app");
  document.addEventListener("click",e=>{
    const a=e.target.closest&&e.target.closest("a[href]");
    if(a && /^https?:/i.test(a.href) && a.target==="_blank"){ e.preventDefault(); openExternal(a.href); }
  },true);
}

/* ===== Cloud persistence ===== */
let saveTimer=null, dirtyIds=new Set();
const loadedRev={};        // {id: rev} last known cloud rev
const cloudMeta={};        // {id: updated_at ms} from last cloud load
const recentSaved={};      // {id: rev} to ignore own realtime events
let pendingIds=new Set();  // IDs with local changes not yet confirmed
let realtimeCh=null;

function syncSoon(){
  if(state.activeId){ dirtyIds.add(state.activeId); mirrorSave(state.activeId); pendingIds.add(state.activeId);
    try{ localStorage.setItem('coc:pending',JSON.stringify([...pendingIds])); }catch(e){} }
  clearTimeout(saveTimer); saveTimer=setTimeout(flushSaves,600);
}
function scenarioRow(id){
  const s=state.scenarios[id];
  return { id, user_id:currentUser.id, title:s.title||"", system:s.system||"coc7", data:s,
           is_public:!!s.is_public, share_id:s.share_id||null, updated_at:new Date().toISOString() };
}
async function flushSaves(){
  if(!currentUser||!dirtyIds.size) return;
  const ids=[...dirtyIds].filter(id=>state.scenarios[id]); dirtyIds.clear(); setSaveStatus("saving");
  const failed=[];
  for(const id of ids){
    try{
      const row=scenarioRow(id);
      if(loadedRev[id]===undefined){
        // 신규 시나리오 insert
        const {error}=await sb.from("scenarios").insert([{...row,rev:0}]);
        if(error) throw error;
        loadedRev[id]=0; recentSaved[id]=0;
      } else {
        const newRev=loadedRev[id]+1;
        const {data:upd,error}=await sb.from("scenarios")
          .update({...row,rev:newRev}).eq('id',id).eq('rev',loadedRev[id]).select('id');
        if(error) throw error;
        if(upd&&upd.length){
          loadedRev[id]=newRev; recentSaved[id]=newRev;
        } else {
          // 충돌: 다른 기기가 먼저 저장
          failed.push(id); showConflictBanner(id); continue;
        }
      }
      mirrorSave(id); pendingIds.delete(id);
      if(state.scenarios[id].is_public) pushShare(id);
      maybeSnapshot(id);
      try{ localStorage.setItem('coc:pending',JSON.stringify([...pendingIds])); }catch(e){}
    }catch(err){ console.error("저장 실패",id,err); failed.push(id); }
  }
  failed.forEach(id=>dirtyIds.add(id));
  setSaveStatus(failed.length?"error":"saved");
}
async function cloudDelete(id){
  removeShare(id);
  try{ await sb.from("scenarios").update({deleted_at:new Date().toISOString(),is_public:false}).eq("id",id); }
  catch(e){ console.error("삭제 실패",e); }
}
async function cloudHardDelete(id){
  removeShare(id);
  try{ await sb.from("scenarios").delete().eq("id",id); }catch(e){ console.error("영구삭제 실패",e); }
}
async function cloudRestore(id){
  try{ await sb.from("scenarios").update({deleted_at:null}).eq("id",id); }catch(e){ console.error("복원 실패",e); }
}
async function loadScenariosFromCloud(){
  const {data,error}=await sb.from("scenarios")
    .select("id,data,updated_at,rev").eq("user_id",currentUser.id)
    .is("deleted_at",null).order("updated_at",{ascending:false});
  if(error){ console.error(error); return {}; }
  const map={};
  (data||[]).forEach(r=>{
    const o=r.data||{}; o.id=r.id; map[r.id]=o;
    loadedRev[r.id]=r.rev||0; cloudMeta[r.id]=new Date(r.updated_at).getTime();
  });
  return map;
}
function setSaveStatus(s){ const el=document.getElementById("saveStatus"); if(!el) return;
  el.dataset.s=s; el.textContent=s==="saving"?"저장 중…":s==="error"?"저장 실패":"저장됨"; }

/* ===== Realtime ===== */
function subscribeRealtime(uid){
  if(realtimeCh) return;
  realtimeCh=sb.channel('scn-'+uid)
    .on('postgres_changes',{event:'*',schema:'public',table:'scenarios',filter:`user_id=eq.${uid}`},handleRtEvent)
    .subscribe();
}
function handleRtEvent(payload){
  const {eventType,new:nr,old:or}=payload;
  const id=(nr||or||{}).id; if(!id) return;
  const inRev=nr&&nr.rev;
  // 직접 저장한 이벤트는 무시
  if(inRev!=null && recentSaved[id]===inRev){ delete recentSaved[id]; return; }
  if(eventType==='DELETE'||(nr&&nr.deleted_at)){
    if(state.scenarios[id]){ delete state.scenarios[id];
      if(state.activeId===id) state.activeId=Object.keys(state.scenarios)[0]||null;
      render(); }
    return;
  }
  if(eventType==='INSERT'||eventType==='UPDATE'){
    const sdata=nr.data||{}; sdata.id=id;
    if(dirtyIds.has(id)){ showConflictBanner(id); return; }
    // 집중 세션 중인 시나리오는 덮어쓰지 않는다 (지금 타이핑 중인 내용 보호)
    if(focus.active && focus.sceneId && state.activeId===id){
      const incoming=migrate(sdata);
      const liveScene=(state.scenarios[id].scenes||[]).find(x=>x.id===focus.sceneId);
      const taVal=editorEl()?getEditorHtml():null;
      state.scenarios[id]=incoming; loadedRev[id]=nr.rev||0;
      // 현재 편집 중인 씬의 desc는 화면 값으로 유지하고, 저장 대기 표시
      const keepScene=(incoming.scenes||[]).find(x=>x.id===focus.sceneId);
      if(keepScene && taVal!=null && keepScene.desc!==taVal){ keepScene.desc= taVal; dirtyIds.add(id); }
      focus.scene=keepScene||null;
      return; // 화면 재렌더 안 함
    }
    state.scenarios[id]=migrate(sdata); loadedRev[id]=nr.rev||0;
    if(state.activeId===id) render(); else{ renderTop(); renderRail(); }
  }
}

/* ===== Conflict banner ===== */
function showConflictBanner(id){
  const b=document.getElementById('conflictBanner'); b.dataset.id=id; b.style.display='flex';
}
function hideConflictBanner(){ document.getElementById('conflictBanner').style.display='none'; }

/* ===== Offline mirror ===== */
function mirrorSave(id){
  try{ const s=state.scenarios[id]; if(!s) return;
    localStorage.setItem('coc:mirror:'+id,JSON.stringify({ts:Date.now(),data:s})); }catch(e){}
}
function mirrorLoad(id){ try{ const r=localStorage.getItem('coc:mirror:'+id); return r?JSON.parse(r):null; }catch(e){ return null; } }
function checkOfflinePending(cloudMap){
  try{
    const raw=localStorage.getItem('coc:pending'); if(!raw) return;
    const ids=JSON.parse(raw); if(!ids.length) return;
    pendingIds=new Set(ids);
    const stale=[];
    for(const id of pendingIds){
      const m=mirrorLoad(id); if(!m) continue;
      const ct=cloudMeta[id]||0; if(m.ts>ct) stale.push({id,m});
    }
    if(!stale.length) return;
    if(!confirm(`저장되지 않은 로컬 변경(${stale.length}개)을 복원할까?`)) return;
    stale.forEach(({id,m})=>{ state.scenarios[id]=migrate(m.data); if(!(id in cloudMap)) loadedRev[id]=undefined; dirtyIds.add(id); });
    syncSoon(); render();
  }catch(e){}
}
// 온라인 복귀 시 pending flush
window.addEventListener('online',()=>{ if(pendingIds.size) flushSaves(); });
// 미저장 변경 경고
window.addEventListener('beforeunload',e=>{ if(dirtyIds.size){ e.preventDefault(); e.returnValue='저장되지 않은 변경이 있어.'; } });

/* ===== Helpers ===== */
const uid=(p="id")=>p+"_"+Math.random().toString(36).slice(2,9);
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

/* ===== 리치 텍스트 유틸 (집중 모드 서식) ===== */
// desc가 HTML을 담는지 판별 (허용 태그가 하나라도 있으면 HTML로 간주)
const RICH_TAGS=/<(\/?)(b|strong|i|em|u|s|strike|del|span|p|br|div|mark|sub|sup)\b/i;
function isRichHtml(str){ return typeof str==="string" && (RICH_TAGS.test(str)||/class=["'](roll-block|kp-memo)/.test(str)); }
// 표시용: 평문이면 개행을 <br>·문단으로, 이미 HTML이면 정제해서 그대로
function descToHtml(desc){
  if(desc==null||desc==="") return "";
  if(isRichHtml(desc)) return sanitizeHtml(desc);
  // 평문 → HTML (기존 데이터 호환)
  return esc(desc).replace(/\n/g,"<br>");
}
// 평문 추출: 검색·글자수·내보내기용. 태그 제거 + 판정/메모 블록 텍스트 포함
function stripHtml(str){
  if(str==null) return "";
  if(!isRichHtml(str)) return String(str);
  const tmp=parseInert(str);
  let out="";
  (function walk(node){
    for(const c of node.childNodes){
      if(c.nodeType===3){ out+=c.textContent; continue; }
      if(c.nodeType!==1) continue;
      if(c.classList && c.classList.contains("roll-block")){
        let data=null;
        if(c.hasAttribute("data-roll")){ try{ data=JSON.parse(c.getAttribute("data-roll")); }catch(e){} }
        if(!data){ data=serializeRoll(c); }
        out+="\n[판정: "+(data.skill||"")+"]\n";
        (data.results||[]).forEach(r=>{ out+=(r.title||"결과")+": "+stripHtml(r.body||"")+"\n"; });
        continue;
      }
      if(c.classList && c.classList.contains("kp-memo")){
        const txt=c.hasAttribute("data-memo")?c.getAttribute("data-memo"):(c.querySelector(".kp-memo-body")?c.querySelector(".kp-memo-body").textContent:"");
        out+="\n[KP 메모: "+txt+"]\n"; continue;
      }
      const tag=c.tagName;
      walk(c);
      if(tag==="P"||tag==="DIV"||tag==="BR") out+="\n";
    }
  })(tmp);
  return out.replace(/\n{3,}/g,"\n\n").trim();
}

/* ===== 글자수 집계 ===== */
// 페이지 환산 기준: 구글 문서 한글 기본 서식 ≈ 공백 포함 1,000자/페이지 (대략치)
const CHARS_PER_PAGE=1000;
// 씬 하나의 원고 텍스트(낭독문 + 진행). KP노트는 메모라 제외.
function sceneManuscriptText(s){
  return [stripHtml(s.readAloud||""), stripHtml(s.desc||"")].filter(Boolean).join("\n");
}
// 글자수 지표: 공백 포함/미포함, 원고지 매수, 페이지 환산
function textCounts(text){
  const withSp=text.length;
  const noSp=text.replace(/\s/g,"").length;
  return { withSp, noSp, sheets:withSp/200, pages:withSp/CHARS_PER_PAGE };
}
function sceneCounts(s){ return textCounts(sceneManuscriptText(s)); }
// 시나리오 전체 합계
function scenarioCounts(a){
  let text="";
  orderedScenes(a).forEach(s=>{ const t=sceneManuscriptText(s); if(t) text+=t+"\n"; });
  return textCounts(text);
}
// 짧은 표기용 (1,234 / 1.2천 등은 과하니 그냥 로케일)
function fmtN(n){ return Math.round(n).toLocaleString(); }

// 내보내기용: HTML 서식을 마크다운으로 (색·바탕색은 마크다운에 없어 버림)
function htmlToMarkdown(str){
  if(str==null) return "";
  if(!isRichHtml(str)) return String(str);
  const tmp=document.createElement("div"); tmp.innerHTML=sanitizeHtml(str);
  function conv(node){
    let out="";
    for(const c of node.childNodes){
      if(c.nodeType===3){ out+=c.textContent; continue; }
      if(c.nodeType!==1){ continue; }
      if(c.classList && c.classList.contains("roll-block")){
        let data=null; if(c.hasAttribute("data-roll")){ try{ data=JSON.parse(c.getAttribute("data-roll")); }catch(e){} }
        if(!data) data=serializeRoll(c);
        out+=`\n**【판정: ${data.skill||"—"}】**\n`;
        (data.results||[]).forEach(r=>{ out+=`- *${r.title||"결과"}* — ${htmlToMarkdown(r.body||"").replace(/\n+/g," ")}\n`; });
        out+="\n"; continue;
      }
      if(c.classList && c.classList.contains("kp-memo")){
        const txt=c.hasAttribute("data-memo")?c.getAttribute("data-memo"):(c.querySelector(".kp-memo-body")?c.querySelector(".kp-memo-body").textContent:"");
        out+=`\n> **KP 메모:** ${txt}\n\n`; continue;
      }
      const inner=conv(c);
      switch(c.tagName){
        case "B": case "STRONG": out+="**"+inner+"**"; break;
        case "I": case "EM": out+="*"+inner+"*"; break;
        case "U": out+=inner; break;
        case "S": case "STRIKE": case "DEL": out+="~~"+inner+"~~"; break;
        case "BR": out+="\n"; break;
        case "P": case "DIV": out+=inner+"\n"; break;
        default: out+=inner;
      }
    }
    return out;
  }
  return conv(tmp).replace(/\n{3,}/g,"\n\n").trim();
}
// 붙여넣기·저장 시 허용 태그/속성만 남기는 정제기 (XSS 방어)
const ALLOWED_TAGS=new Set(["B","STRONG","I","EM","U","S","STRIKE","DEL","P","BR","DIV","SPAN","MARK","SUB","SUP"]);
// DOMParser 문서는 스크립트·이미지 onerror를 실행하지 않음 (detached div의 innerHTML은 이미지 로드를 일으켜 위험)
function parseInert(html){ return new DOMParser().parseFromString("<!doctype html><body>"+String(html==null?"":html)+"</body>","text/html").body; }
function sanitizeHtml(html){
  const tmp=parseInert(html);
  (function walk(node){
    const kids=[...node.childNodes];
    for(const c of kids){
      if(c.nodeType===1){ // element
        // 판정 블록/메모: data 속성만 남기고 내부는 비움(로드 시 재구성). XSS 안전.
        if(c.nodeType===1 && c.classList && c.classList.contains("roll-block")){
          const data=serializeRoll(c);
          const clean=tmp.ownerDocument.createElement("div"); clean.className="roll-block";
          clean.setAttribute("data-roll", JSON.stringify(data));
          node.replaceChild(clean,c); continue;
        }
        if(c.nodeType===1 && c.classList && c.classList.contains("kp-memo")){
          const txt=(c.querySelector(".kp-memo-body")?c.querySelector(".kp-memo-body").textContent:c.getAttribute("data-memo")||"");
          const clean=tmp.ownerDocument.createElement("div"); clean.className="kp-memo";
          clean.setAttribute("data-memo", txt);
          node.replaceChild(clean,c); continue;
        }
        if(!ALLOWED_TAGS.has(c.tagName)){
          while(c.firstChild) node.insertBefore(c.firstChild,c);
          node.removeChild(c); continue;
        }
        const keepStyle=[];
        if(c.hasAttribute("style")){
          const st=c.getAttribute("style");
          const col=st.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
          const bg=st.match(/background-color\s*:\s*([^;]+)/i);
          const fs=st.match(/font-size\s*:\s*([^;]+)/i);
          if(col) keepStyle.push("color:"+col[1].trim());
          if(bg) keepStyle.push("background-color:"+bg[1].trim());
          if(fs) keepStyle.push("font-size:"+fs[1].trim());
        }
        [...c.attributes].forEach(a=>c.removeAttribute(a.name));
        if(keepStyle.length) c.setAttribute("style",keepStyle.join(";"));
        walk(c);
      } else if(c.nodeType===8){ node.removeChild(c); }
    }
  })(tmp);
  return tmp.innerHTML;
}
// 판정 블록 DOM → 데이터 객체
function serializeRoll(el){
  // 이미 data-roll만 있는 경우(재직렬화)
  if(el.hasAttribute("data-roll") && !el.querySelector(".roll-skill")){
    try{ return JSON.parse(el.getAttribute("data-roll")); }catch(e){}
  }
  const skill=el.querySelector(".roll-skill")?el.querySelector(".roll-skill").value:"";
  const results=[...el.querySelectorAll(".roll-res")].map(r=>({
    title:r.querySelector(".roll-res-title")?r.querySelector(".roll-res-title").value:"",
    body:r.querySelector(".roll-res-body")?r.querySelector(".roll-res-body").innerHTML:"",
    collapsed:r.classList.contains("collapsed"),
  }));
  return { skill, results };
}
// 판정 데이터 → 표시/편집용 DOM (editable=true면 입력 가능)
function buildRollDOM(data, editable){
  const wrap=document.createElement("div"); wrap.className="roll-block"; wrap.setAttribute("contenteditable","false");
  const ro=editable?"":"readonly";
  const results=(data.results&&data.results.length)?data.results:[{title:"",body:"",collapsed:false}];
  const head=`<div class="roll-head"><span class="roll-badge">판정</span><input class="roll-skill" ${ro} placeholder="기능치 (예: 도서관 이용, 회피, 아이디어…)" value="${esc(data.skill||"")}" />${editable?'<button class="roll-del" title="판정 삭제">✕</button>':''}</div>`;
  const resList=results.map(r=>rollResHTML(r,editable)).join("");
  const addBtn=editable?'<button class="roll-addres">+ 결과 칸 추가</button>':'';
  wrap.innerHTML=head+`<div class="roll-results">`+resList+addBtn+`</div>`;
  return wrap;
}
function rollResHTML(r,editable){
  const ce=editable?'contenteditable="true"':'';
  const ro=editable?'':'readonly';
  const bodyEmpty=(!r.body||r.body.trim()==="")?' data-empty="1"':'';
  const head=`<div class="roll-res-head"><span class="roll-res-caret"></span><input class="roll-res-title" ${ro} placeholder="결과 이름 (대성공·성공·실패·펌블…)" value="${esc(r.title||"")}" />${editable?'<button class="roll-res-del" title="이 칸 삭제">✕</button>':''}</div>`;
  return `<div class="roll-res ${r.collapsed?'collapsed':''}">`+head+`<div class="roll-res-body" ${ce}${bodyEmpty}>${sanitizeHtml(r.body||"")}</div></div>`;
}
// 저장된 desc HTML의 빈 roll-block/kp-memo(data만)를 표시용 DOM으로 채움
function hydrateBlocks(container, editable){
  container.querySelectorAll(".roll-block").forEach(el=>{
    if(el.querySelector(".roll-skill")) return; // 이미 채워짐
    let data={skill:"",results:[]};
    try{ if(el.hasAttribute("data-roll")) data=JSON.parse(el.getAttribute("data-roll")); }catch(e){}
    const built=buildRollDOM(data, editable);
    el.replaceWith(built);
  });
  container.querySelectorAll(".kp-memo").forEach(el=>{
    if(el.querySelector(".kp-memo-body")) return;
    const txt=el.getAttribute("data-memo")||"";
    const built=buildMemoDOM(txt, editable);
    el.replaceWith(built);
  });
  // 저장 왕복에서 남은 빈 래퍼 정리
  try{ cleanBlockBodiesSafe(container); }catch(e){}
}
function buildMemoDOM(text, editable){

function blankScenario(title){
  const acts=[{id:uid("act"),title:"도입"},{id:uid("act"),title:"전개"},{id:uid("act"),title:"결말"}];
  return { id:uid("scn"), title:title||"새 시나리오", system:"coc7", customRuleName:"", customFields:[], customDice:{expr:"1d20",target:"",dir:"gte"},
    overview:{era:"",place:"",players:"",hook:"",summary:""},
    acts, scenes:[], edges:[], npcs:[], locations:[], clues:[], handouts:[] };
}
function migrate(a){
  if(!a.system) a.system="coc7";
  if(typeof a.customRuleName!=="string") a.customRuleName="";
  if(!Array.isArray(a.customFields)) a.customFields=[];
  a.customFields.forEach(f=>{ if(!f.id) f.id=uid("cf"); if(f.label==null) f.label=""; });
  if(!a.customDice||typeof a.customDice!=="object") a.customDice={expr:"1d20",target:"",dir:"gte"};
  if(a.customDice.expr==null) a.customDice.expr="1d20"; if(a.customDice.target==null) a.customDice.target=""; if(a.customDice.dir==null) a.customDice.dir="gte";
  a.overview=a.overview||{era:"",place:"",players:"",hook:"",summary:""};
  a.scenes=a.scenes||[]; a.edges=a.edges||[];
  a.npcs=a.npcs||[]; a.locations=a.locations||[]; a.clues=a.clues||[]; a.handouts=a.handouts||[];
  if(!Array.isArray(a.writingLog)) a.writingLog=[];
  if(!Array.isArray(a.acts)||!a.acts.length){
    const act={id:uid("act"),title:"본편"}; a.acts=[act];
    a.scenes.forEach((s,i)=>{ s.actId=act.id; if(typeof s.order!=="number") s.order=i; });
  }
  a.scenes.forEach((s,i)=>{
    if(s.logline==null) s.logline="";
    if(s.readAloud==null) s.readAloud="";
    if(s.kpNotes==null) s.kpNotes="";
    if(s.desc==null) s.desc="";
    if(!s.actId || !a.acts.some(ac=>ac.id===s.actId)) s.actId=a.acts[0].id;
    if(typeof s.order!=="number") s.order=i;
    s.npcs=s.npcs||[]; s.locations=s.locations||[]; s.clues=s.clues||[];
    if(!s.status) s.status="draft";
  });
  a.clues.forEach(c=>{ if(!Array.isArray(c.leadsScenes)) c.leadsScenes=[]; });
  a.npcs.forEach(n=>{ if(!n.sb||typeof n.sb!=="object") n.sb={}; ["STR","CON","SIZ","DEX","INT","POW","APP","EDU"].forEach(k=>{ if(n.sb[k]==null) n.sb[k]=""; }); n.sb.skills=n.sb.skills||[]; n.sb.attacks=n.sb.attacks||[]; });
  reindex(a);
  return a;
}
function reindex(a){
  a.acts.forEach(act=>{
    a.scenes.filter(s=>s.actId===act.id).sort((x,y)=>x.order-y.order).forEach((s,i)=>s.order=i);
  });
}
function orderedScenes(a){
  const out=[];
  a.acts.forEach(act=>{ a.scenes.filter(s=>s.actId===act.id).sort((x,y)=>x.order-y.order).forEach(s=>out.push(s)); });
  a.scenes.filter(s=>!a.acts.some(ac=>ac.id===s.actId)).forEach(s=>out.push(s));
  return out;
}
function numbering(a){ const m={}; orderedScenes(a).forEach((s,i)=>m[s.id]=i+1); return m; }

async function maybeOfferLegacyImport(){

  try{
    const r=await window.storage.get(LEGACY_KEY); if(!r||!r.value) return;
    const old=JSON.parse(r.value); const olds=old&&old.scenarios?Object.values(old.scenarios):[];
    if(!olds.length) return;
    if(!confirm("이 브라우저에 저장돼 있던 로컬 시나리오 "+olds.length+"개를 클라우드 계정으로 가져올까?")) { try{ await window.storage.delete(LEGACY_KEY); }catch(e){} return; }
    const rows=olds.map(o=>{ migrate(o); const id=uid("scn"); o.id=id; state.scenarios[id]=o; return scenarioRow(id); });
    await sb.from("scenarios").upsert(rows);
    try{ await window.storage.delete(LEGACY_KEY); }catch(e){}
    state.activeId=rows[rows.length-1].id; render();
    alert("로컬 시나리오를 계정으로 가져왔어.");
  }catch(e){ console.error("이전 실패",e); }
}

/* ===== 공유 데이터 (플레이어에게 보여도 되는 것만) ===== */
function buildSharePayload(a){
  const o=a.overview||{};
  const rev=a._play&&a._play.revealed;
  const hos=(a.handouts||[]).filter(h=>!h.hideInShare && (!(rev&&rev.length) || rev.includes(h.id)));
  return {
    title:a.title||"", system:a.system||"coc7",
    overview:{era:o.era||"",place:o.place||"",players:o.players||"",hook:o.hook||""},
    acts:(a.acts||[]).map(x=>({id:x.id,title:x.title})),
    scenes:(a.scenes||[]).map(x=>({id:x.id,actId:x.actId,order:x.order,type:x.type,title:x.title||"",readAloud:stripHtml(x.readAloud||"")})),
    edges:[],
    handouts:hos.map(h=>({id:h.id,title:h.title||"",content:h.content||"",imageUrl:h.imageUrl||""})),
    npcs:(a.npcs||[]).filter(n=>n.name).map(n=>({id:n.id,name:n.name,role:n.role||"",appearance:n.appearance||""})),
    locations:(a.locations||[]).filter(l=>l.name).map(l=>({id:l.id,name:l.name,desc:l.desc||""}))
  };
}
function newShareId(){
  const b=new Uint8Array(12); crypto.getRandomValues(b);
  return [...b].map(x=>"abcdefghijkmnpqrstuvwxyz23456789"[x%32]).join("");
}
async function pushShare(id){
  const a=state.scenarios[id]; if(!a||!currentUser||!a.is_public||!a.share_id) return {ok:true};
  const {error}=await sb.from("shares").upsert([{share_id:a.share_id,scenario_id:id,user_id:currentUser.id,
    payload:buildSharePayload(a),updated_at:new Date().toISOString()}],{onConflict:"scenario_id"});
  if(error){ console.warn("공유 갱신 실패",error); return {ok:false,error}; }
  return {ok:true};
}
async function removeShare(id){ try{ await sb.from("shares").delete().eq("scenario_id",id); }catch(e){} }

/* ===== 공유 뷰 (읽기 전용 · 플레이어 안전) ===== */
async function renderShareView(shareId){
  const wrap=document.createElement("div"); wrap.id="shareView"; document.body.appendChild(wrap);
  wrap.innerHTML=`<div class="sv-load">불러오는 중…</div>`;
  // 공유 전용 테이블(shares)에서 걸러진 정보만 받아온다. 진상·KP 메모는 애초에 저장되지 않음.
  const { data, error }=await sb.rpc("get_share",{ p_share_id: shareId });
  if(error||!data){ wrap.innerHTML=`<div class="sv-load">공유된 시나리오를 찾을 수 없어. 링크가 만료됐거나 공유가 해제됐어.</div>`; return; }
  const a=data||{}; migrate(a);
  const o=a.overview||{}; const num=numbering(a);
  const metaBits=[o.era,o.place,o.players].filter(Boolean).map(esc).join(" · ");
  let html=`<div class="sv-doc">
    <div class="sv-brand">CASE <b>FILE</b> · 공유</div>
    <h1 class="sv-title">${esc(a.title||"시나리오")}</h1>
    ${metaBits?`<div class="sv-meta">${metaBits}</div>`:""}
    ${o.hook?`<div class="sv-block"><div class="sv-h">도입</div><p>${esc(o.hook).replace(/\n/g,"<br>")}</p></div>`:""}`;
  a.acts.forEach(act=>{
    const scs=orderedScenes(a).filter(s=>s.actId===act.id);
    if(!scs.length) return;
    html+=`<div class="sv-act">${esc(act.title)}</div>`;
    scs.forEach(s=>{
      const ra=(s.readAloud||"").trim();
      html+=`<div class="sv-scene"><div class="sv-sh"><span class="sv-n">${num[s.id]}</span>${esc(s.title||"제목 없는 씬")}<span class="sv-type">${esc(s.type||"")}</span></div>${ra?`<p class="sv-read">${esc(ra).replace(/\n/g,"<br>")}</p>`:""}</div>`;
    });
  });
  if(a.handouts&&a.handouts.length){
    const vis=a.handouts;
    if(vis.length){ html+=`<div class="sv-act">핸드아웃</div>`;
      vis.forEach(h=>{ const img=h.imageUrl?`<img src="${esc(h.imageUrl)}" style="max-width:100%;border-radius:6px;margin-top:8px;display:block" alt="" loading="lazy" />`:"";
        html+=`<div class="sv-block"><div class="sv-h">${esc(h.title||"핸드아웃")}</div><p>${esc(h.content||"").replace(/\n/g,"<br>")}</p>${img}</div>`; }); } }
  if(a.npcs&&a.npcs.length){ const vis=a.npcs.filter(n=>n.name); if(vis.length){ html+=`<div class="sv-act">등장인물</div>`;
    vis.forEach(n=>{ html+=`<div class="sv-block"><div class="sv-h">${esc(n.name)}${n.role?` <span class="sv-role">${esc(n.role)}</span>`:""}</div>${n.appearance?`<p>${esc(n.appearance).replace(/\n/g,"<br>")}</p>`:""}</div>`; }); } }
  if(a.locations&&a.locations.length){ const vis=a.locations.filter(l=>l.name); if(vis.length){ html+=`<div class="sv-act">장소</div>`;
    vis.forEach(l=>{ html+=`<div class="sv-block"><div class="sv-h">${esc(l.name)}</div>${l.desc?`<p>${esc(l.desc).replace(/\n/g,"<br>")}</p>`:""}</div>`; }); } }
  html+=`<div class="sv-foot">진상·KP 메모·단서·스탯 등 GM 전용 정보는 공유 뷰에서 가려져 있어.</div></div>`;
  wrap.innerHTML=html;
  document.title=(a.title||"시나리오")+" · 공유";
}

function sceneCard(a,s,num){
  const key=KEY_TYPES.has(s.type);
  const chips=[];
  const sc=sceneCounts(s);
  if(sc.withSp>0) chips.push(`<span class="cp count" title="공백 포함 ${fmtN(sc.withSp)}자 · 공백 미포함 ${fmtN(sc.noSp)}자 · 원고지 ${sc.sheets.toFixed(1)}매">${fmtN(sc.withSp)}자</span>`);
  if(s.clues.length) chips.push(`<span class="cp clue">단서 ${s.clues.length}</span>`);
  if(s.npcs.length) chips.push(`<span class="cp">NPC ${s.npcs.length}</span>`);
  if(s.locations.length) chips.push(`<span class="cp">장소 ${s.locations.length}</span>`);
  a.edges.filter(e=>e.from===s.id).forEach(e=>{
    const t=a.scenes.find(x=>x.id===e.to); if(t) chips.push(`<span class="cp next">→ ${esc((t.title||"제목 없음").slice(0,14))}</span>`);
  });
  return `<div class="scene-card" data-scene="${s.id}">
    <div class="grip" data-grip="${s.id}" title="드래그로 이동">
      <svg width="10" height="16" viewBox="0 0 10 16"><circle cx="2.5" cy="3" r="1.1"/><circle cx="7.5" cy="3" r="1.1"/><circle cx="2.5" cy="8" r="1.1"/><circle cx="7.5" cy="8" r="1.1"/><circle cx="2.5" cy="13" r="1.1"/><circle cx="7.5" cy="13" r="1.1"/></svg>
    </div>
    <div class="sc-main" data-open="${s.id}">
      <div class="sc-top">
        <button class="sc-status st-${s.status}" data-status="${s.id}" title="작성 상태"></button>
        <span class="sc-num">${String(num[s.id]).padStart(2,"0")}</span>
        <span class="sc-type ${key?'key':''}">${s.type}</span>
        <span class="sc-title ${s.title?'':'empty'}">${esc(s.title||"제목 없는 씬")}</span>
      </div>
      <div class="sc-logline ${s.logline?'':'empty'}">${esc(s.logline||"한 줄 요약 없음")}</div>
      ${chips.length?`<div class="sc-chips">${chips.join("")}</div>`:``}
    </div>
    <div class="sc-actions">
      <button data-scenedup="${s.id}" title="복제"><svg width="13" height="13" viewBox="0 0 13 13"><rect x="4" y="4" width="7.5" height="7.5" rx="1.3" stroke="currentColor" stroke-width="1.1" fill="none"/><path d="M8.5 2.5V2a1 1 0 00-1-1H2a1 1 0 00-1 1v5.5a1 1 0 001 1h.5" stroke="currentColor" stroke-width="1.1" fill="none"/></svg></button>
      <button data-open="${s.id}" title="편집"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M9.5 1.5l2 2L4 11l-2.5.5L2 9z" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linejoin="round"/></svg></button>
      <button class="danger" data-scenedel="${s.id}" title="삭제"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M3 3l7 7M10 3l-7 7" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>`;

function bindOutline(a){
  const root=document.getElementById("main");
  root.querySelectorAll("[data-dense]").forEach(b=>b.addEventListener("click",()=>{ boardDense=b.dataset.dense==="1"; renderOutline(root); }));
  on("addAct","click",()=>{ a.acts.push({id:uid("act"),title:"새 막"}); renderOutline(root); renderRail(); syncSoon(); });

  root.querySelectorAll("[data-collapse]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.collapse; if(collapsedActs.has(id)) collapsedActs.delete(id); else collapsedActs.add(id);
    b.closest(".act-group").classList.toggle("collapsed");
  }));
  root.querySelectorAll("[data-acttitle]").forEach(inp=>inp.addEventListener("input",()=>{
    const act=a.acts.find(x=>x.id===inp.dataset.acttitle); if(act){ act.title=inp.value; syncSoon(); }
  }));
  root.querySelectorAll("[data-actup]").forEach(b=>b.addEventListener("click",()=>moveAct(b.dataset.actup,-1)));
  root.querySelectorAll("[data-actdown]").forEach(b=>b.addEventListener("click",()=>moveAct(b.dataset.actdown,1)));
  root.querySelectorAll("[data-actdel]").forEach(b=>b.addEventListener("click",()=>deleteAct(b.dataset.actdel)));
  root.querySelectorAll("[data-addscene]").forEach(b=>b.addEventListener("click",()=>addSceneToAct(b.dataset.addscene)));

  root.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",e=>{ e.stopPropagation(); openSceneEditor(el.dataset.open); }));
  root.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); cycleStatus(b.dataset.status,b); }));
  root.querySelectorAll("[data-scenedel]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); deleteScene(b.dataset.scenedel); }));
  root.querySelectorAll("[data-scenedup]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); duplicateScene(b.dataset.scenedup); }));
  root.querySelectorAll("[data-grip]").forEach(g=>g.addEventListener("pointerdown",e=>{ e.preventDefault(); startSceneDrag(g.dataset.grip,e); }));
}
function cycleStatus(id,btn){
  const a=active(); const s=a.scenes.find(x=>x.id===id); if(!s) return;
  s.status = s.status==="draft"?"wip":s.status==="wip"?"done":"draft";
  if(btn) btn.className="sc-status st-"+s.status;
  updateProgress(); syncSoon();
}
function updateProgress(){
  const a=active(), total=a.scenes.length, done=a.scenes.filter(s=>s.status==="done").length;
  const f=document.getElementById("progFill"), t=document.getElementById("progText");
  if(f) f.style.width=(total?Math.round(done/total*100):0)+"%";
  if(t) t.textContent=`${done}/${total} 완성`;
}

function moveAct(id,dir){
  const a=active(); const i=a.acts.findIndex(x=>x.id===id); const j=i+dir;
  if(j<0||j>=a.acts.length) return;
  const [x]=a.acts.splice(i,1); a.acts.splice(j,0,x);
  renderOutline(document.getElementById("main")); syncSoon();
}
function deleteAct(id){
  const a=active(); if(a.acts.length<=1) return;
  const act=a.acts.find(x=>x.id===id); const scenes=a.scenes.filter(s=>s.actId===id);
  const i=a.acts.findIndex(x=>x.id===id); const target=a.acts[i-1]||a.acts[i+1];
  if(scenes.length && !confirm(`이 막의 씬 ${scenes.length}개를 "${target.title}"으로 옮기고 막을 삭제할까?`)) return;
  undoPush(`막 "${act.title}" 삭제`);
  scenes.forEach(s=>s.actId=target.id);
  a.acts=a.acts.filter(x=>x.id!==id);
  reindex(a);
  renderOutline(document.getElementById("main")); renderRail(); syncSoon();
  showToast(`막 "${act.title}" 삭제됨`,'실행취소',undoPop);
}
function addSceneToAct(actId){
  const a=active();
  const order=a.scenes.filter(s=>s.actId===actId).reduce((m,s)=>Math.max(m,s.order),-1)+1;
  const hasAny=a.scenes.length>0;
  const s={ id:uid("sc"), actId, order, type:hasAny?"조사":"도입", title:"", logline:"", readAloud:"", desc:"", kpNotes:"", status:"draft", npcs:[], locations:[], clues:[] };
  a.scenes.push(s);
  renderOutline(document.getElementById("main")); renderRail(); syncSoon();
  openSceneEditor(s.id);
}
function duplicateScene(id){
  const a=active(); const s=a.scenes.find(x=>x.id===id); if(!s) return null;
  const c=JSON.parse(JSON.stringify(s));
  c.id=uid("sc"); c.title=(s.title||"제목 없는 씬")+" (복사)"; c.status="draft";
  a.scenes.filter(x=>x.actId===s.actId&&x.order>s.order).forEach(x=>x.order++);
  c.order=s.order+1;
  if(typeof s.fx==="number"){ c.fx=s.fx+30; c.fy=s.fy+30; }
  a.scenes.push(c); reindex(a);
  refreshAfterScene();
  showToast(`"${s.title||'제목 없는 씬'}" 복제됨 · 분기 연결은 복사되지 않아`);
  return c;
}
function deleteScene(id){
  const a=active(); const s=a.scenes.find(x=>x.id===id); if(!s) return;
  undoPush(`씬 "${s.title||'제목 없음'}" 삭제`);
  a.scenes=a.scenes.filter(x=>x.id!==id);
  a.edges=a.edges.filter(e=>e.from!==id&&e.to!==id);
  reindex(a);
  if(section==="outline") renderOutline(document.getElementById("main"));
  else if(section==="manuscript") renderManuscript(document.getElementById("main"));
  renderRail(); syncSoon();
  showToast(`씬 "${s.title||'제목 없음'}" 삭제됨`,'실행취소',undoPop);
}

/* ===== Scene drag ===== */
let sdrag=null;
function startSceneDrag(id,e){
  const card=document.querySelector(`.scene-card[data-scene="${id}"]`);
  if(!card) return;
  const rect=card.getBoundingClientRect();
  const clone=card.cloneNode(true);
  clone.classList.add("drag-clone");
  clone.style.width=rect.width+"px";
  clone.style.left=rect.left+"px"; clone.style.top=rect.top+"px";
  document.body.appendChild(clone);
  const ind=document.createElement("div"); ind.className="drop-ind";
  card.classList.add("dragging-src");
  document.body.classList.add("dragging");
  sdrag={ id, card, clone, ind, offX:e.clientX-rect.left, offY:e.clientY-rect.top, target:null };
  window.addEventListener("pointermove",onSceneDragMove);
  window.addEventListener("pointerup",endSceneDrag,{once:true});
}
function onSceneDragMove(e){
  if(!sdrag) return;
  sdrag.clone.style.left=(e.clientX-sdrag.offX)+"px";
  sdrag.clone.style.top=(e.clientY-sdrag.offY)+"px";
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const group=el&&el.closest("[data-actbody]");
  if(sdrag.ind.parentNode) sdrag.ind.remove();
  if(!group){ sdrag.target=null; return; }
  const actId=group.dataset.actbody;
  const cards=[...group.querySelectorAll(".scene-card:not(.dragging-src)")];
  let before=null;
  for(const c of cards){ const r=c.getBoundingClientRect(); if(e.clientY < r.top+r.height/2){ before=c; break; } }
  const addBtn=group.querySelector(".act-add-inline");
  const emptyMsg=group.querySelector(".act-empty");
  if(before) group.insertBefore(sdrag.ind, before);
  else if(addBtn) group.insertBefore(sdrag.ind, addBtn);
  else group.appendChild(sdrag.ind);
  if(emptyMsg) emptyMsg.style.display="none";
  sdrag.target={ actId, before: before?before.dataset.scene:null };
}
function endSceneDrag(){
  window.removeEventListener("pointermove",onSceneDragMove);
  if(!sdrag) return;
  if(sdrag.ind.parentNode) sdrag.ind.remove();
  sdrag.clone.remove();
  sdrag.card.classList.remove("dragging-src");
  document.body.classList.remove("dragging");
  const a=active(), t=sdrag.target, id=sdrag.id;
  sdrag=null;
  if(t){
    const s=a.scenes.find(x=>x.id===id);
    let list=a.scenes.filter(x=>x.actId===t.actId && x.id!==id).sort((x,y)=>x.order-y.order);
    let idx=t.before? list.findIndex(x=>x.id===t.before) : list.length;
    if(idx<0) idx=list.length;
    s.actId=t.actId;
    list.splice(idx,0,s);
    list.forEach((x,i)=>x.order=i);
    reindex(a);
    syncSoon();
  }
  renderOutline(document.getElementById("main"));
  renderRail();
}

    ${linkBlock("이 씬의 단서","clues",a.clues,s.clues,true)}
    ${nextBlock(a,s,num)}`;
  const body=document.getElementById("drawerBody");
  bindLink(body,s);
  bindNext(body,s);
  bind("se_title","input",v=>{ s.title=v; });

  (function(){ const d=document.getElementById("se_desc"); if(d){
    hydrateBlocks(d, true);

    d.addEventListener("input",()=>{ s.desc=sanitizeHtml(d.innerHTML); syncSoon(); });

function refreshAfterScene(){
  if(section==="outline") renderOutline(document.getElementById("main"));
  else if(section==="manuscript") renderManuscript(document.getElementById("main"));
  renderRail(); syncSoon();
}
function linkBlock(title,key,list,selected,isClue){
  if(!list.length) return `<div class="linkgrp"><div class="lh">${title}</div><div class="linkempty">등장요소에서 먼저 만들어줘.</div></div>`;
  const chips=list.map(it=>`<button class="chiptoggle ${selected.includes(it.id)?'on':''}" data-link="${key}" data-itemid="${it.id}">${esc(it.name||it.title||"무제")}</button>`).join("");
  return `<div class="linkgrp"><div class="lh">${title}</div><div class="chips">${chips}</div></div>`;
}
function bindLink(scope,scene){
  scope.querySelectorAll("[data-link]").forEach(btn=>btn.addEventListener("click",()=>{
    const arr=scene[btn.dataset.link]; const id=btn.dataset.itemid; const i=arr.indexOf(id);
    if(i>=0) arr.splice(i,1); else arr.push(id);
    btn.classList.toggle("on"); syncSoon();
  }));
}
function nextBlock(a,scene,num){
  const others=orderedScenes(a).filter(s=>s.id!==scene.id);
  if(!others.length) return "";
  const has=id=>a.edges.some(e=>e.from===scene.id&&e.to===id);
  const chips=others.map(s=>`<button class="chiptoggle ${has(s.id)?'on':''}" data-next="${s.id}">${String(num[s.id]).padStart(2,"0")} ${esc(s.title||"제목 없음")}</button>`).join("");
  return `<div class="linkgrp"><div class="lh">다음으로 이어지는 씬 — 분기</div><div class="chips">${chips}</div></div>`;
}
function bindNext(scope,scene){
  const a=active();
  scope.querySelectorAll("[data-next]").forEach(btn=>btn.addEventListener("click",()=>{
    const to=btn.dataset.next;
    const i=a.edges.findIndex(e=>e.from===scene.id&&e.to===to);
    if(i>=0) a.edges.splice(i,1); else a.edges.push({id:uid("e"),from:scene.id,to});
    btn.classList.toggle("on"); syncSoon();
  }));
}

function openCardEditor(sec,id){
  const a=active(); const list=a[sec];

  document.getElementById("drawerBody").innerHTML=sec==="npcs"?npcForm(item):cardForm(sec,item);

  on("c_del","click",()=>{

/* ===== Generic stat block (schema-driven, per-system) ===== */
function sbSchema(){
  const sys=activeSystem();
  if(sys.custom){
    const a=active(), fields=(a.customFields||[]).map(f=>({key:f.id,label:f.label||"필드"}));
    const parts=[];
    if(fields.length) parts.push({type:"fields",id:"abil",label:null,fields:fields});
    parts.push({type:"rows",id:"skills",label:"기능 · 특기",cols:[{key:"name",ph:"이름",flex:true},{key:"val",ph:"값",w:84}]});
    parts.push({type:"rows",id:"attacks",label:"공격",cols:[{key:"name",ph:"공격",flex:true},{key:"val",ph:"명중·판정",w:92},{key:"dmg",ph:"피해",w:92}]});
    parts.push({type:"text",id:"special",label:"비고",ph:"특수 능력·메모"});
    return parts;
  }
  return sys.sb;
}
function deriveLineHtml(fn,sb){ return (fn(sb)||[]).map(it=>`<span class="dv"><b>${esc(it.label)}</b>${it.value==null||it.value===""?"—":esc(String(it.value))}</span>`).join(""); }
function sbRowHtml(part,r,i){
  const inputs=part.cols.map(c=>{
    const style=c.flex?"flex:1":("width:"+(c.w||80)+"px"+(c.key!=="name"?";text-align:center":""));
    return `<input data-rowcol="${part.id}|${i}|${c.key}" ${c.num?'inputmode="numeric"':""} value="${esc((r&&r[c.key])||"")}" placeholder="${esc(c.ph||"")}" style="${style}" />`;
  }).join("");
  return `<div class="sbrow">${inputs}<button class="sb-x" data-rowdel="${part.id}|${i}">×</button></div>`;
}
function renderSbPart(part,sb){
  if(part.type==="fields"){
    const grid=part.fields.map(f=>`<label class="ch"><span>${esc(f.label)}</span><input data-sbf="${f.key}" ${f.text?"":'inputmode="numeric"'} value="${esc(sb[f.key]||"")}" /></label>`).join("");
    const der=part.derive?`<div class="derived" data-derive="${part.id}">${deriveLineHtml(part.derive,sb)}</div>`:"";
    return `${part.label?`<div class="sbsub">${esc(part.label)}</div>`:""}<div class="charsgrid">${grid}</div>${der}`;
  }
  if(part.type==="rows"){
    const rows=(sb[part.id]||[]).map((r,i)=>sbRowHtml(part,r,i)).join("");
    return `<div class="sbsub">${esc(part.label)}</div><div data-rows="${part.id}">${rows}</div><button class="sb-add" data-rowadd="${part.id}">추가</button>`;
  }
  if(part.type==="text") return `<div class="sbsub">${esc(part.label)}</div><textarea class="ta short" data-sbt="${part.id}" placeholder="${esc(part.ph||"")}">${esc(sb[part.id]||"")}</textarea>`;
  return "";
}
function bindRowCols(root,sb){
  root.querySelectorAll("[data-rowcol]").forEach(inp=>inp.addEventListener("input",()=>{
    const p=inp.dataset.rowcol.split("|"), id=p[0], i=+p[1], key=p[2];
    sb[id]=sb[id]||[]; sb[id][i]=sb[id][i]||{}; sb[id][i][key]=inp.value; syncSoon();
  }));
  root.querySelectorAll("[data-rowdel]").forEach(b=>b.addEventListener("click",()=>{
    const p=b.dataset.rowdel.split("|"), id=p[0], i=+p[1];
    sb[id].splice(i,1); rerenderSbRows(sb,id); syncSoon();
  }));
}
function rerenderSbRows(sb,id){
  const part=sbSchema().find(p=>p.id===id), cont=document.querySelector(`[data-rows="${id}"]`); if(!cont||!part) return;
  cont.innerHTML=(sb[id]||[]).map((r,i)=>sbRowHtml(part,r,i)).join(""); bindRowCols(cont,sb);
}
function bindSbParts(sb){
  const body=document.getElementById("drawerBody");
  body.querySelectorAll("[data-sbf]").forEach(inp=>inp.addEventListener("input",()=>{
    sb[inp.dataset.sbf]=inp.value;
    sbSchema().forEach(p=>{ if(p.type==="fields"&&p.derive){ const el=body.querySelector(`[data-derive="${p.id}"]`); if(el) el.innerHTML=deriveLineHtml(p.derive,sb); } });
    syncSoon();
  }));
  body.querySelectorAll("[data-sbt]").forEach(t=>{ autoGrow(t); t.addEventListener("input",()=>{ sb[t.dataset.sbt]=t.value; autoGrow(t); syncSoon(); }); });
  bindRowCols(body,sb);
  body.querySelectorAll("[data-rowadd]").forEach(b=>b.addEventListener("click",()=>{ const id=b.dataset.rowadd; sb[id]=sb[id]||[]; sb[id].push({}); rerenderSbRows(sb,id); syncSoon(); }));
}

function bindCardForm(sec,it){
  const M={ npcs:{f_name:"name",f_role:"role",f_app:"appearance",f_mot:"motive",f_stats:"stats",f_notes:"notes"},

function bindHandoutImage(it){

  if(!btn) return;
  btn.addEventListener("click",()=>inp.click());

  if(wrap){ wrap.addEventListener("dragover",e=>{e.preventDefault();wrap.style.borderColor="var(--clue)"});

async function uploadHandoutImage(file,it,statusEl){
  if(!file||!file.type.startsWith("image/")) return;
  if(statusEl) statusEl.textContent="업로드 중…";
  try{
    const path=`${currentUser.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
    const {error}=await sb.storage.from("handouts").upload(path,file,{upsert:true});
    if(error) throw error;
    const {data}=sb.storage.from("handouts").getPublicUrl(path);
    it.imageUrl=data.publicUrl;
    if(statusEl) statusEl.textContent="업로드 완료";
    const prev=document.querySelector(".ho-img-prev");
    if(prev) prev.src=it.imageUrl;
    else{ const img=document.createElement("img"); img.className="ho-img-prev"; img.src=it.imageUrl;
      document.querySelector(".ho-img-wrap").prepend(img); }
    syncSoon();
  }catch(e){ console.error(e); if(statusEl) statusEl.textContent="업로드 실패"; }
}

/* ===== Manuscript ===== */
function renderManuscript(main){
  const a=active(), o=a.overview, num=numbering(a);
  const metaBits=[o.era,o.place,o.players].filter(Boolean).join(" · ");
  let bodyHtml="";
  const ordered=orderedScenes(a);
  if(!ordered.length){ bodyHtml=`<div class="ms-empty">아직 씬이 없어. 줄거리 탭에서 씬을 추가해줘.</div>`; }
  else{
    a.acts.forEach(act=>{
      const scenes=a.scenes.filter(s=>s.actId===act.id).sort((x,y)=>x.order-y.order);
      if(!scenes.length) return;
      bodyHtml+=`<div class="ms-act">${esc(act.title)}</div>`;
      scenes.forEach(s=>bodyHtml+=msChapter(s,num));

  const hoBlock=a.handouts.length?`<div class="ms-ho"><div class="hh">핸드아웃</div>${
    a.handouts.map(h=>`<div class="hoitem" data-ho="${h.id}">

      <textarea class="grow" data-hofield="content" placeholder="플레이어에게 보여줄 내용">${esc(h.content)}</textarea>
    </div>`).join("")}</div>`:"";
  main.innerHTML=`<div class="scroll"><div class="ms" id="ms">
    <div class="ms-head">
      <input class="ms-title" id="ms_title" value="${esc(a.title)}" placeholder="시나리오 제목" />
      <div class="ms-meta">${metaBits?esc(metaBits):'<span style="color:var(--faintest)">시대·무대·인원 미입력</span>'} · <a data-goto="setup">설정 편집</a></div>
      <div class="ms-toolbar">
        <button class="tbtn on" id="ms_focus"><svg width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.1" fill="none"/><circle cx="7" cy="7" r="2" fill="currentColor"/></svg>집중 모드</button>
        <button class="tbtn" id="ms_print"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M4 5V2h6v3M4 11H2V6h10v5h-2M4 9h6v4H4z" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linejoin="round"/></svg>인쇄 · PDF</button>
        <button class="tbtn" id="ms_md"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M7 9V1M4 6l3 3 3-3M2 12h10" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>전문 .md 내보내기</button>
      </div>
    </div>
    ${bodyHtml}
    <div class="ms-add"><button data-goto="outline"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M3 3.5h7M3 7h7M3 10.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>줄거리에서 씬 구성</button></div>
    ${hoBlock}
  </div></div>`;
  bindManuscript(a);
  requestAnimationFrame(()=>sizeAllGrows(main));
}
function msChapter(s,num){
  const key=KEY_TYPES.has(s.type);
  return `<div class="ms-chapter" data-ch="${s.id}">
    <div class="ms-chnum">
      <span class="idx">${String(num[s.id]).padStart(2,"0")}</span>
      <span class="tp ${key?'key':''}">${s.type}</span>
      <button class="jump" data-edit="${s.id}">상세 편집</button>
    </div>
    <input class="ms-chtitle" data-chfield="title" data-id="${s.id}" value="${esc(s.title)}" placeholder="씬 제목" />
    ${s.logline?`<div class="ms-chsub">${esc(s.logline)}</div>`:``}
    <div class="ms-box"><div class="bl">낭독 · 박스 텍스트</div>
      <textarea class="grow" data-chfield="readAloud" data-id="${s.id}" placeholder="플레이어에게 그대로 읽어줄 묘사">${esc(s.readAloud)}</textarea></div>
    <div class="grow ms-rich" contenteditable="true" data-richfield="desc" data-id="${s.id}" data-ph="장면 진행 — 벌어지는 일, 분위기, 판정 포인트, 분기">${descToHtml(s.desc)}</div>
    <details class="ms-kp" ${s.kpNotes?"open":""}><summary>KP 노트</summary>
      <textarea class="grow" data-chfield="kpNotes" data-id="${s.id}" placeholder="KP 전용 메모 — 진행 팁, 숨은 정보, 주의점">${esc(s.kpNotes)}</textarea></details>
  </div>`;
}
function bindManuscript(a){
  const ms=document.getElementById("ms");
  const t=document.getElementById("ms_title");
  t.addEventListener("input",()=>{ a.title=t.value||"이름 없는 시나리오"; setText("scnTtl",a.title); renderTop(); syncSoon(); });
  ms.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>{ section=b.dataset.goto; render(); }));
  ms.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openSceneEditor(b.dataset.edit)));
  on("ms_print","click",()=>appPrint());
  on("ms_focus","click",()=>openFocusPicker(a));
  on("ms_md","click",exportMarkdown);
  ms.addEventListener("input",e=>{
    const rf=e.target.closest("[data-richfield]");
    if(rf){ const s=a.scenes.find(x=>x.id===rf.dataset.id); if(s) s[rf.dataset.richfield]=sanitizeHtml(e.target.innerHTML); syncSoon(); return; }
    const f=e.target.closest("[data-chfield]");
    if(f){ const s=a.scenes.find(x=>x.id===f.dataset.id); if(s) s[f.dataset.chfield]=e.target.value;
      if(e.target.classList.contains("grow")) autoGrow(e.target); syncSoon(); return; }
    const ho=e.target.closest("[data-hofield]");
    if(ho){ const wrap=e.target.closest("[data-ho]"); const h=a.handouts.find(x=>x.id===wrap.dataset.ho);
      if(h) h[ho.dataset.hofield]=e.target.value; if(e.target.classList.contains("grow")) autoGrow(e.target); syncSoon(); }
  });
  // 리치 desc 붙여넣기: 순수 텍스트로 + 판정/메모 블록 복원·바인딩
  ms.querySelectorAll("[data-richfield]").forEach(d=>{
    d.addEventListener("paste",e=>{
      e.preventDefault(); const txt=(e.clipboardData||window.clipboardData).getData("text/plain");
      document.execCommand("insertText",false,txt);
    });
    hydrateBlocks(d, true);
    bindBlockDelegation(d);
  });
}

/* ===== Focus session ===== */
const focus={
  active:false, sceneId:null, scene:null,
  startText:"", startTs:0,
  activeMs:0,           // 순수 집필 시간 (멈춤 제외)
  lastKeyTs:0, typing:false,
  keystrokes:0, peakCpm:0,
  speedWin:[],          // 최근 키 타임스탬프 (속도 계산용)
  nudgeSec:10, nudgeTimer:null, nudgeShown:false,
  goalType:"none", goalVal:0,
  sound:false, volume:0.6, typewriter:false, dim:false, spell:true,
  tickTimer:null, saveTimer:null,
};
const FOCUS_PREF_KEY="coc:focusPrefs";

function loadFocusPrefs(){
  try{ const r=localStorage.getItem(FOCUS_PREF_KEY); if(r) return {...FOCUS_DEFAULTS,...JSON.parse(r)}; }catch(e){}
  return {...FOCUS_DEFAULTS};
}
const FOCUS_DEFAULTS={ nudgeSec:10, sound:IS_APP, volume:0.6, typewriter:false, dim:false, spell:true, goalType:"none", goalVal:0 };
function saveFocusPrefs(){
  try{ localStorage.setItem(FOCUS_PREF_KEY, JSON.stringify({
    nudgeSec:focus.nudgeSec, sound:focus.sound, volume:focus.volume, typewriter:focus.typewriter,
    dim:focus.dim, spell:focus.spell, goalType:focus.goalType, goalVal:focus.goalVal })); }catch(e){}
}

/* contenteditable 에디터 텍스트/HTML 접근 */
function editorEl(){ return document.getElementById("fsTA"); }
function getEditorText(){
  const el=editorEl(); if(!el) return "";
  // <div>/<br>를 개행으로 환산해 평문 추출
  return stripHtml(el.innerHTML);
}
function getEditorHtml(){ const el=editorEl(); return el?sanitizeHtml(el.innerHTML):""; }

/* 씬 선택: 미완성 우선, 없으면 첫 씬 */
function openFocusPicker(a){
  const ordered=orderedScenes(a);
  if(!ordered.length){ showToast("먼저 줄거리 탭에서 씬을 추가해줘."); return; }
  const pick=ordered.find(s=>s.status!=="done")||ordered[0];
  startFocusSession(a,pick.id);
}

/* 글자수 계산 (한글 기준) */
function countMetrics(text){
  const charsWith=text.length;
  const charsNo=text.replace(/\s/g,"").length;
  const words=(text.trim().match(/\S+/g)||[]).length;
  const sheet=(charsWith/200);   // 원고지 200자 기준
  return { charsWith, charsNo, words, sheet };
}

function startFocusSession(a,sceneId){
  const s=a.scenes.find(x=>x.id===sceneId); if(!s) return;
  const p=loadFocusPrefs();
  focus.active=true; focus.sceneId=sceneId; focus.scene=s;
  focus.startTs=Date.now();
  focus.activeMs=0; focus.lastKeyTs=0; focus.typing=false;
  focus.keystrokes=0; focus.peakCpm=0; focus.speedWin=[];
  focus.nudgeShown=false;
  focus.nudgeSec=p.nudgeSec; focus.sound=p.sound; focus.volume=p.volume;
  focus.typewriter=p.typewriter; focus.dim=p.dim; focus.spell=p.spell;
  focus.goalType=p.goalType; focus.goalVal=p.goalVal;

  const num=numbering(a);
  setText("fsSceneTitle", `${String(num[s.id]||0).padStart(2,"0")} · ${s.type}`);
  setText("fsSceneSub", s.title||"제목 없는 씬");
  const el=editorEl();
  el.innerHTML=descToHtml(s.desc||"");
  hydrateBlocks(el, true);
  focus.startText=getEditorText();

  // 자동완성 이름 목록 준비
  buildNameIndex(a);

  applyFocusToolStates();
  applyGoalUI();
  applyNudgeUI();

  document.getElementById("focusOverlay").classList.add("open");
  document.getElementById("fsSet").classList.remove("open");
  focusUpdateMetrics();
  setTimeout(()=>{ el.focus(); placeCaretEnd(el); },50);

  focus.tickTimer=setInterval(focusTick,250);
  focus.saveTimer=setInterval(focusPersist,3000);
  resetNudgeTimer();
}

function placeCaretEnd(el){
  try{ const r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }catch(e){}
}

function applyFocusToolStates(){
  document.getElementById("fsSound").classList.toggle("on",focus.sound);
  document.getElementById("fsTypewriter").classList.toggle("on",focus.typewriter);
  document.getElementById("fsDim").classList.toggle("on",focus.dim);
  document.getElementById("fsScroll").classList.toggle("dim",focus.dim);
  document.getElementById("fsPage").classList.toggle("typewriter",focus.typewriter);
  updateVolumeUI();
  if(focus.dim) renderDimLayer(); else clearDimLayer();
  if(focus.spell) scheduleSpellcheck(); else clearSpellLayer();
}
function applyNudgeUI(){
  document.querySelectorAll("#fsNudgeSeg [data-nudge]").forEach(b=>b.classList.toggle("on",+b.dataset.nudge===focus.nudgeSec));
}
function applyGoalUI(){
  document.querySelectorAll("#fsGoalSeg [data-goaltype]").forEach(b=>b.classList.toggle("on",b.dataset.goaltype===focus.goalType));
  const row=document.getElementById("fsGoalValRow"), wrap=document.getElementById("fsGoalWrap");
  if(focus.goalType==="none"){ row.style.display="none"; wrap.style.display="none"; }
  else{
    row.style.display="";
    const isWords=focus.goalType==="words";
    setText("fsGoalValLabel", isWords?"목표 글자 수 (공백 미포함)":"목표 시간 (분)");
    setText("fsGoalUnit", isWords?"자":"분");
    const inp=document.getElementById("fsGoalVal");
    inp.value=focus.goalVal||(isWords?500:15);
    focus.goalVal=+inp.value;
    wrap.style.display="";
  }
  updateGoalBar();
}
function updateGoalBar(){
  if(focus.goalType==="none"){ return; }
  const m=countMetrics(getEditorText());
  let cur=0, target=focus.goalVal||1;
  if(focus.goalType==="words"){ cur=Math.max(0,m.charsNo-countMetrics(focus.startText).charsNo); setText("fsGoalLabel","글자 목표"); }
  else{ cur=Math.floor(focus.activeMs/60000); setText("fsGoalLabel","시간 목표"); }
  const pct=Math.min(100,Math.round(cur/target*100));
  document.getElementById("fsGoalFill").style.width=pct+"%";
  setText("fsGoalPct", pct+"%");
}

function focusUpdateMetrics(){
  const m=countMetrics(getEditorText());
  setText("fsChars", m.charsWith.toLocaleString());
  setText("fsCharsNo", m.charsNo.toLocaleString());
  setText("fsWords", m.words.toLocaleString());
  setText("fsSheet", m.sheet.toFixed(1));
  updateGoalBar();
}
function fmtClock(ms){ const s=Math.floor(ms/1000); const mm=Math.floor(s/60), ss=s%60; return `${mm}:${String(ss).padStart(2,"0")}`; }

function focusTick(){
  const now=Date.now();
  if(focus.typing && now-focus.lastKeyTs<1500){ focus.activeMs+=250; }
  else focus.typing=false;
  const cut=now-8000; focus.speedWin=focus.speedWin.filter(t=>t>cut);
  const cpm=Math.round(focus.speedWin.length/8*60);
  if(cpm>focus.peakCpm) focus.peakCpm=cpm;
  setText("fsSpeed", cpm.toLocaleString());
  setText("fsTime", fmtClock(focus.activeMs));
  updateGoalBar();
}

function onFocusInput(){
  const now=Date.now();
  focus.typing=true; focus.lastKeyTs=now;
  focus.keystrokes++; focus.speedWin.push(now);
  focusUpdateMetrics();
  if(focus.dim) renderDimLayer();
  if(focus.typewriter) scrollTypewriter();
  if(focus.spell) scheduleSpellcheck();
  updateAutocomplete();
  hideNudge();
  resetNudgeTimer();
}

/* 커서의 화면상 세로 위치 (contenteditable) */
function caretClientY(){
  const sel=window.getSelection();
  if(!sel.rangeCount) return null;
  const r=sel.getRangeAt(0).cloneRange();
  let rect=r.getClientRects()[0];
  if(!rect){ // 빈 줄 등: 임시 마커로 위치 측정
    const span=document.createElement("span"); span.textContent="\u200b";
    r.insertNode(span); rect=span.getBoundingClientRect(); span.remove();
  }
  return rect?rect.top+rect.height/2:null;
}

/* 타이프라이터: 커서를 화면 중앙으로 */
function scrollTypewriter(){
  const scroll=document.getElementById("fsScroll");
  const cy=caretClientY(); if(cy==null) return;
  const scRect=scroll.getBoundingClientRect();
  const rel=cy-scRect.top+scroll.scrollTop;
  const target=rel-scroll.clientHeight/2;
  scroll.scrollTo({top:Math.max(0,target),behavior:"smooth"});
}

/* ===== 문장/문단 디밍 — 불투명도 방식 (서식·색 유지) ===== */
function caretTextOffset(el){
  const sel=window.getSelection(); if(!sel.rangeCount) return null;
  const r=sel.getRangeAt(0);
  const pre=r.cloneRange(); pre.selectNodeContents(el); pre.setEnd(r.endContainer,r.endOffset);
  return stripHtml(fragToHtml(pre.cloneContents())).length;
}
function fragToHtml(frag){ const d=document.createElement("div"); d.appendChild(frag); return d.innerHTML; }

// 커서가 속한 "직계 블록"을 찾아 .cur-para 부여, 나머지는 흐리게.
// 최상위에 바로 텍스트가 있으면(첫 줄 미래핑) 그 텍스트도 블록처럼 취급.
function renderDimLayer(){
  const el=editorEl();
  el.classList.add("dimmed");
  // 커서가 포함된 직계 자식 요소 찾기
  const sel=window.getSelection();
  let curTop=null;
  if(sel.rangeCount){
    let node=sel.anchorNode;
    // 텍스트노드면 부모로 올라가며 el의 직계 자식을 찾음
    while(node && node.parentNode!==el && node!==el){ node=node.parentNode; }
    if(node && node!==el && node.nodeType===1){
      // 직계 요소가 커서 블록
      [...el.children].forEach(c=>c.classList.toggle("cur-para", c===node));
      return;
    }
  }
  // 미래핑 텍스트(블록 요소 없음)거나 못 찾음: 커서 y좌표 기준으로 근접 블록 밝힘
  const cy=caretClientY();
  if(cy==null){ [...el.children].forEach(c=>c.classList.remove("cur-para")); return; }
  let best=null, bestDist=Infinity;
  [...el.children].forEach(c=>{
    const r=c.getBoundingClientRect(); const mid=r.top+r.height/2;
    const d=Math.abs(mid-cy); if(d<bestDist){ bestDist=d; best=c; }
  });
  [...el.children].forEach(c=>c.classList.toggle("cur-para", c===best));
}
function clearDimLayer(){ const el=editorEl(); if(el){ el.classList.remove("dimmed"); [...el.children].forEach(c=>c.classList.remove("cur-para")); } }

/* ===== 맞춤법 (내장 사전 기반, 자주 틀리는 패턴) ===== */
// 라이터가 무시 가능 — 밑줄만 그어 표시(의도적 연출일 수 있으므로 강제하지 않음).
// [정규식패턴, 추천어(없으면 null)]
const SPELL_CHECKS=[
  ["됬","됐"],["뵜","봤"],["웬지","왠지"],["왠만","웬만"],["어떻해","어떡해"],["어떻개","어떻게"],
  ["역활","역할"],["희안","희한"],["오랫만","오랜만"],["오랜동안","오랫동안"],["설겆","설거지"],
  ["일부로","일부러"],["구지(?![가-힣])","굳이"],["궂이","굳이"],["몇일","며칠"],["베게","베개"],
  ["금새","금세"],["설레임","설렘"],["부시시","부스스"],["추스리","추스르"],["서슴치","서슴지"],
  ["뒤치닥","뒤치다꺼리"],["문안하(?=다|게|지)","무난하"],["않되(?=다|고|서|는)","안 되"],
  ["안되(?=다|고|서|는|요|나|면)","안 되"],["뭐에요","뭐예요"],["할께","할게"],["갈께","갈게"],
  ["줄께","줄게"],["바꼇","바뀌었"],["설레히","설레게"],
];
let spellTimer=null;
function scheduleSpellcheck(){ clearTimeout(spellTimer); spellTimer=setTimeout(runSpellcheck,400); }
function clearSpellLayer(){ const l=document.getElementById("fsSpellLayer"); if(l) l.remove(); }
function runSpellcheck(){
  if(!focus.active||!focus.spell) return;
  const el=editorEl(), page=document.getElementById("fsPage"); if(!el||!page) return;
  let layer=document.getElementById("fsSpellLayer");
  if(!layer){ layer=document.createElement("div"); layer.className="spell-layer"; layer.id="fsSpellLayer"; page.appendChild(layer); }
  const pr=page.getBoundingClientRect();
  const regs=SPELL_CHECKS.map(([pat,sugg])=>new RegExp(pat,"g"));
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  let out="", count=0, node;
  while((node=walker.nextNode()) && count<300){
    const t=node.textContent; if(!t||t.length<2) continue;
    for(const re of regs){
      re.lastIndex=0; let m;
      while((m=re.exec(t)) && count<300){
        if(m[0].length===0){ re.lastIndex++; continue; }
        const r=document.createRange(); r.setStart(node,m.index); r.setEnd(node,m.index+m[0].length);
        for(const rc of r.getClientRects()){
          if(rc.width<1) continue;
          out+=`<i style="left:${(rc.left-pr.left).toFixed(1)}px;top:${(rc.bottom-pr.top-3).toFixed(1)}px;width:${rc.width.toFixed(1)}px"></i>`;
          count++;
        }
      }
    }
  }
  layer.innerHTML=out;
}
window.addEventListener("resize",()=>{ if(focus.active&&focus.spell) scheduleSpellcheck(); });

/* ===== 이름 자동완성 (NPC·지명) ===== */
let nameIndex=[];   // [{name, kind}]
let acState={ open:false, items:[], sel:0, anchor:0 };
function buildNameIndex(a){
  const list=[];
  (a.npcs||[]).forEach(n=>{ if(n.name&&n.name.trim()) list.push({name:n.name.trim(),kind:"NPC"}); });
  (a.locations||[]).forEach(l=>{ if(l.name&&l.name.trim()) list.push({name:l.name.trim(),kind:"장소"}); });
  (a.clues||[]).forEach(c=>{ if(c.name&&c.name.trim()) list.push({name:c.name.trim(),kind:"단서"}); });
  // 중복 제거
  const seen=new Set(); nameIndex=list.filter(x=>{ const k=x.name.toLowerCase(); if(seen.has(k))return false; seen.add(k); return true; });
}
// 커서 앞의 "부분 단어"(한글/영문 연속) 추출
function currentToken(){
  const sel=window.getSelection(); if(!sel.rangeCount) return null;
  const node=sel.anchorNode; if(!node||node.nodeType!==3) return null;
  const off=sel.anchorOffset;
  const before=node.textContent.slice(0,off);
  const m=before.match(/([가-힣A-Za-z]{1,20})$/);
  if(!m) return null;
  return { text:m[1], node, start:off-m[1].length, end:off };
}
function updateAutocomplete(){
  const box=document.getElementById("fsAutocomplete");
  const tok=currentToken();
  if(!tok||tok.text.length<1||!nameIndex.length){ closeAutocomplete(); return; }
  const q=tok.text.toLowerCase();
  const matches=nameIndex.filter(x=>x.name.toLowerCase().startsWith(q)&&x.name.toLowerCase()!==q).slice(0,6);
  if(!matches.length){ closeAutocomplete(); return; }
  acState.open=true; acState.items=matches; acState.sel=0; acState.token=tok;
  box.innerHTML=matches.map((x,i)=>`<div class="ac-item ${i===0?'sel':''}" data-i="${i}">${esc(x.name)}<span class="ac-kind">${x.kind}</span></div>`).join("");
  // 위치: 커서 근처
  const sel=window.getSelection(); const rect=sel.getRangeAt(0).getBoundingClientRect();
  box.style.left=rect.left+"px"; box.style.top=(rect.bottom+4)+"px";
  box.classList.add("open");
  box.querySelectorAll(".ac-item").forEach(it=>it.addEventListener("mousedown",e=>{ e.preventDefault(); acPick(+it.dataset.i); }));
}
function closeAutocomplete(){ acState.open=false; const b=document.getElementById("fsAutocomplete"); if(b) b.classList.remove("open"); }
function acMove(d){
  if(!acState.open) return;
  acState.sel=(acState.sel+d+acState.items.length)%acState.items.length;
  document.querySelectorAll("#fsAutocomplete .ac-item").forEach((it,i)=>it.classList.toggle("sel",i===acState.sel));
}
function acPick(i){
  if(!acState.open) return;
  const pick=acState.items[i!=null?i:acState.sel]; if(!pick) return;
  const tok=acState.token;
  // 토큰 텍스트를 선택 이름으로 교체
  try{
    const r=document.createRange();
    r.setStart(tok.node,tok.start); r.setEnd(tok.node,tok.end);
    r.deleteContents();
    const tnode=document.createTextNode(pick.name);
    r.insertNode(tnode);
    // 커서를 삽입 뒤로
    const sel=window.getSelection(); sel.removeAllRanges();
    const nr=document.createRange(); nr.setStartAfter(tnode); nr.collapse(true); sel.addRange(nr);
  }catch(e){}
  closeAutocomplete();
  onFocusInput();
}

/* "써." 알림 */
function resetNudgeTimer(){
  clearTimeout(focus.nudgeTimer);
  if(!focus.active||focus.nudgeSec<=0) return;
  focus.nudgeTimer=setTimeout(showNudge, focus.nudgeSec*1000);
}
function showNudge(){ if(!focus.active) return; document.getElementById("focusNudge").classList.add("show"); focus.nudgeShown=true; }
function hideNudge(){ if(focus.nudgeShown){ document.getElementById("focusNudge").classList.remove("show"); focus.nudgeShown=false; } }

/* 씬에 HTML 반영 (자동 저장) */
function focusPersist(){
  if(!focus.active) return;
  const a=state.scenarios[state.activeId]; if(!a) return;
  const s=(a.scenes||[]).find(x=>x.id===focus.sceneId);
  if(!s){ return; }
  focus.scene=s;
  const html=getEditorHtml();
  if(s.desc!==html){ s.desc=html; syncSoon(); }
}

function endFocusSession(){
  if(!focus.active) return;
  focusPersist();
  clearInterval(focus.tickTimer); clearInterval(focus.saveTimer); clearTimeout(focus.nudgeTimer);
  clearTimeout(spellTimer); closeAutocomplete();
  hideNudge();
  const before=countMetrics(focus.startText), after=countMetrics(getEditorText());
  const written=Math.max(0, after.charsNo-before.charsNo);
  const activeMin=focus.activeMs/60000;
  const avgCpm=activeMin>0.05?Math.round(written/activeMin):0;
  const durationMs=Date.now()-focus.startTs;

  const a=active();
  recordWritingSession(a, { written, activeMs:focus.activeMs, durationMs, avgCpm, peakCpm:focus.peakCpm, sceneId:focus.sceneId });

  focus.active=false;
  clearSpellLayer();
  document.getElementById("focusOverlay").classList.remove("open");

  showFocusSummary(a, { written, activeMs:focus.activeMs, avgCpm, peakCpm:focus.peakCpm });

  if(section==="manuscript") renderManuscript(document.getElementById("main"));
  else render();
}

/* 세션 기록 → 시나리오 writingLog + 전역 스트릭 */
function recordWritingSession(a, sess){
  a.writingLog=a.writingLog||[];
  const day=localDay();
  a.writingLog.push({ day, ts:Date.now(), written:sess.written, activeMs:sess.activeMs,
    avgCpm:sess.avgCpm, peakCpm:sess.peakCpm, sceneId:sess.sceneId });
  if(a.writingLog.length>500) a.writingLog=a.writingLog.slice(-500);
  syncSoon();
}
/* 연속 집필일 계산 (모든 시나리오 통합) */
function computeStreak(){
  const days=new Set();
  Object.values(state.scenarios).forEach(a=>{ (a.writingLog||[]).forEach(l=>{ if(l.written>0) days.add(l.day); }); });
  let streak=0; const d=new Date();
  if(!days.has(localDay(d))) d.setDate(d.getDate()-1);
  while(days.has(localDay(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function showFocusSummary(a, r){
  setText("fsumWords", r.written.toLocaleString());
  setText("fsumTime", fmtClock(r.activeMs));
  setText("fsumAvg", r.avgCpm.toLocaleString());
  setText("fsumPeak", r.peakCpm.toLocaleString());
  const streak=computeStreak();
  const todayTotal=(()=>{ const day=localDay(); let sum=0;
    Object.values(state.scenarios).forEach(sc=>{ (sc.writingLog||[]).forEach(l=>{ if(l.day===day) sum+=l.written; }); }); return sum; })();
  const el=document.getElementById("fsumStreak");
  if(r.written>0){
    el.innerHTML=`🔥 연속 <b>${streak}</b>일째 · 오늘 총 <b style="font-size:14px">${todayTotal.toLocaleString()}</b>자`;
    el.style.display="";
  } else { el.style.display="none"; }
  const sub=r.written>0?`이번 세션에서 ${r.written.toLocaleString()}자를 썼어.`:`이번엔 거의 안 썼네. 다음 세션에 이어가자.`;
  setText("fsumSub", sub);
  document.getElementById("focusSummary").classList.add("show");
}

let _typeBufs=null, _typeOff=null, _typeLoading=false, _typeTone=null;
function loadTypeSamples(ctx){
  if(_typeBufs||_typeLoading||!ctx||!TYPE_SND.key) return;
  _typeLoading=true;
  const bufs={}, offs={}, names=Object.keys(TYPE_SND).filter(k=>TYPE_SND[k]);
  let left=names.length;
  const done=()=>{ if(--left<=0){ _typeBufs=bufs.key?bufs:null; _typeOff=offs; _typeLoading=false; } };
  names.forEach(name=>{
    try{
      const bin=atob(TYPE_SND[name]);
      const arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      ctx.decodeAudioData(arr.buffer, b=>{
        bufs[name]=b;
        // mp3 디코더가 앞에 붙이는 무음(약 26ms)만큼 재생 시작점을 밀어 지연을 없앰
        const ch=b.getChannelData(0); let p=0;
        for(let i=0;i<ch.length;i++){ if(Math.abs(ch[i])>0.02){ p=i; break; } }
        offs[name]=Math.max(0,p-Math.floor(0.002*b.sampleRate))/b.sampleRate;
        done();
      }, ()=>done());
    }catch(e){ done(); }
  });
}
function typeToneNode(ctx){
  if(!TYPE_TONE) return null;
  if(!_typeTone){
    _typeTone=ctx.createBiquadFilter();
    _typeTone.type="lowpass"; _typeTone.frequency.value=TYPE_TONE; _typeTone.Q.value=0.7;
    _typeTone.connect(masterGain);
  }
  return _typeTone;
}
function playKeySound(kind){
  const ctx=ensureAudioCtx(); if(!ctx||!masterGain) return;
  if(!_typeBufs) loadTypeSamples(ctx);
  if(_typeBufs) playKeySample(ctx,kind);
  else playKeySynth(kind);
}
function playKeySample(ctx,kind){
  const B=_typeBufs, now=ctx.currentTime, dest=typeToneNode(ctx)||masterGain;
  const fire=(name,rate,gain,delay)=>{
    const buf=B[name]; if(!buf) return;
    const s=ctx.createBufferSource(); s.buffer=buf; s.playbackRate.value=rate;
    const g=ctx.createGain(); g.gain.value=gain*(TYPE_GAIN[name]||1);
    s.connect(g); g.connect(dest);
    s.start(now+delay,_typeOff[name]||0);
  };
  const r=(a,b)=>a+Math.random()*(b-a);
  if(kind==="enter"){                         // 벨 → 캐리지 리턴
    fire("bell", 1.0, 1.0, 0);
    fire(B.key?"key":"bell", r(0.94,0.99), 0.9, 0.10);
  } else if(kind==="space"){
    fire(B.space?"space":"key", r(0.98,1.03), 1.0, 0);
  } else {
    fire("key", r(0.97,1.06), r(0.80,1.0), 0);
  }
}

/* ----- 폴백: 기존 Web Audio 합성음 ----- */
let focusAudioCtx=null, masterGain=null;
function ensureAudioCtx(){
  if(!focusAudioCtx){ try{ focusAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=focusAudioCtx.createGain(); masterGain.gain.value=focus.volume; masterGain.connect(focusAudioCtx.destination);
    }catch(e){ return null; } }
  if(focusAudioCtx.state==="suspended") focusAudioCtx.resume();
  if(masterGain) masterGain.gain.value=focus.volume;
  loadTypeSamples(focusAudioCtx);
  return focusAudioCtx;
}
let _noiseBuf=null;
function noiseBuffer(ctx){
  if(_noiseBuf) return _noiseBuf;
  const len=Math.floor(ctx.sampleRate*0.05);
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1);
  _noiseBuf=buf; return buf;
}
function playKeySynth(kind){
  const ctx=ensureAudioCtx(); if(!ctx||!masterGain) return;
  const now=ctx.currentTime;
  const out=masterGain;
  // 1) 해머 임팩트 (노이즈 → 밴드패스 → 급감쇠)
  const src=ctx.createBufferSource(); src.buffer=noiseBuffer(ctx);
  const bp=ctx.createBiquadFilter(); bp.type="bandpass";
  const g=ctx.createGain();
  // 2) 금속 링 (짧은 사인)
  const ring=ctx.createOscillator(); ring.type="triangle";
  const rg=ctx.createGain(); rg.gain.value=0;
  if(kind==="space"){
    bp.frequency.value=800; bp.Q.value=5; g.gain.setValueAtTime(0.20,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.05);
    ring.frequency.value=190; rg.gain.setValueAtTime(0.05,now); rg.gain.exponentialRampToValueAtTime(0.001,now+0.06);
  } else if(kind==="enter"){
    bp.frequency.value=1300; bp.Q.value=4; g.gain.setValueAtTime(0.26,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.09);
    ring.frequency.value=330; rg.gain.setValueAtTime(0.08,now); rg.gain.exponentialRampToValueAtTime(0.001,now+0.10);
    // 캐리지 리턴 2타
    const src2=ctx.createBufferSource(); src2.buffer=noiseBuffer(ctx);
    const bp2=ctx.createBiquadFilter(); bp2.type="bandpass"; bp2.frequency.value=650; bp2.Q.value=5;
    const g2=ctx.createGain(); g2.gain.setValueAtTime(0.0001,now); g2.gain.setValueAtTime(0.16,now+0.06); g2.gain.exponentialRampToValueAtTime(0.001,now+0.13);
    src2.connect(bp2); bp2.connect(g2); g2.connect(out); src2.start(now+0.06); src2.stop(now+0.14);
  } else {
    // 일반 키: 톤·게인 랜덤화로 반복감 완화
    bp.frequency.value=1500+Math.random()*700; bp.Q.value=6;
    g.gain.setValueAtTime(0.16+Math.random()*0.05,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.04);
    ring.frequency.value=420+Math.random()*160; rg.gain.setValueAtTime(0.04,now); rg.gain.exponentialRampToValueAtTime(0.001,now+0.045);
  }
  src.connect(bp); bp.connect(g); g.connect(out);
  ring.connect(rg); rg.connect(out);
  src.start(now); src.stop(now+0.06);
  ring.start(now); ring.stop(now+0.12);
}

  const s=document.getElementById("fsVol"); if(s) s.value=Math.round(focus.volume*100);
  const l=document.getElementById("fsVolPct"); if(l) l.textContent=Math.round(focus.volume*100)+"%";
}

const TEXT_COLORS=["#e8e6e3","#e5484d","#e5924d","#e5c94d","#5db85d","#4db8b8","#4d7de5","#a24de5","#e54da2","#8a8580"];
const BG_COLORS=["#5c2b2b","#5c4327","#4d4a1f","#26421f","#1f4242","#1f2e52","#3a1f52","#4d1f3a","#3a3a3a"];

/* ===== 판정 블록 / 키퍼 메모 삽입 (집중 모드) ===== */
function insertBlockAtCursor(el, blockNode){
  el.focus();
  const sel=window.getSelection();
  let range;
  if(sel.rangeCount && el.contains(sel.anchorNode)){ range=sel.getRangeAt(0); }
  else { range=document.createRange(); range.selectNodeContents(el); range.collapse(false); }
  range.deleteContents();
  // 블록 앞뒤로 편집 가능한 빈 줄 보장
  const after=document.createElement("div"); after.appendChild(document.createElement("br"));
  range.insertNode(after);
  range.insertNode(blockNode);
  // 커서를 블록 다음 줄로
  const nr=document.createRange(); nr.setStart(after,0); nr.collapse(true);
  sel.removeAllRanges(); sel.addRange(nr);
  onFocusInput();
}
function insertRollBlock(){
  const el=editorEl();
  const node=buildRollDOM({skill:"",results:[{title:"",body:"",collapsed:false}]}, true);
  insertBlockAtCursor(el, node);
  cleanBlockBodiesSafe(el);
  const sk=node.querySelector(".roll-skill"); if(sk) setTimeout(()=>sk.focus(),20);
}
function insertMemo(){
  const el=editorEl();
  const node=buildMemoDOM("", true);
  insertBlockAtCursor(el, node);

  const b=node.querySelector(".kp-memo-body"); if(b) setTimeout(()=>b.focus(),20);
