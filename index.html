/* ===== Cross-scenario search update ===== */
function runSearch(q){
  const a=active(), num=numbering(a);
  const res=document.getElementById("searchResults");
  const term=q.trim().toLowerCase();
  const groups=[];
  const match=(...fs)=>fs.some(f=>stripHtml(f||"").toLowerCase().includes(term));
  if(term){
    const sc=orderedScenes(a).filter(s=>match(s.title,s.logline,s.desc,s.readAloud,s.kpNotes,s.type))
      .map(s=>({cat:"scene",id:s.id,t:`${String(num[s.id]).padStart(2,"0")} ${s.title||"제목 없음"}`,s:s.logline||stripHtml(s.desc)||s.type,scn:null}));
    const np=a.npcs.filter(n=>match(n.name,n.role,n.appearance,n.motive,n.notes)).map(n=>({cat:"npcs",id:n.id,t:n.name||"이름 없음",s:n.role||n.motive||"",scn:null}));
    const lo=a.locations.filter(l=>match(l.name,l.desc,l.notes)).map(l=>({cat:"locations",id:l.id,t:l.name||"이름 없음",s:l.desc||"",scn:null}));
    const cl=a.clues.filter(c=>match(c.name,c.source,c.content,c.leadsTo)).map(c=>({cat:"clues",id:c.id,t:c.name||"이름 없음",s:c.content||c.source||"",scn:null}));
    const ho=a.handouts.filter(h=>match(h.title,h.content)).map(h=>({cat:"handouts",id:h.id,t:h.title||"제목 없음",s:h.content||"",scn:null}));
    if(sc.length) groups.push(["씬",sc]);
    if(np.length) groups.push(["NPC",np]);
    if(lo.length) groups.push(["장소",lo]);
    if(cl.length) groups.push(["단서",cl]);
    if(ho.length) groups.push(["핸드아웃",ho]);
    // 다른 시나리오 검색
    const cross=[];
    Object.values(state.scenarios).forEach(scn=>{
      if(scn.id===state.activeId) return;
      const numX=numbering(scn);
      orderedScenes(scn).filter(s=>match(s.title,s.logline,s.desc,s.type)).forEach(s=>
        cross.push({cat:"scene",id:s.id,t:`${String(numX[s.id]).padStart(2,"0")} ${s.title||"제목 없음"}`,s:scn.title||"",scn:scn.id}));
      scn.npcs.filter(n=>match(n.name,n.role)).forEach(n=>cross.push({cat:"npcs",id:n.id,t:n.name||"이름 없음",s:scn.title||"",scn:scn.id}));
    });
    if(cross.length) groups.push(["다른 시나리오",cross]);
  }
  if(!term){ res.innerHTML=`<div class="sr-empty">제목·내용으로 시나리오 전체를 찾아.</div>`; return; }
  if(!groups.length){ res.innerHTML=`<div class="sr-empty">"${esc(q)}" 결과가 없어.</div>`; return; }
  res.innerHTML=groups.map(([label,items])=>`<div class="sr-group">${label}</div>`+
    items.map(it=>`<div class="sr-item" data-cat="${it.cat}" data-id="${it.id}" data-scn="${it.scn||''}"><span class="sr-t">${esc(it.t)}</span><span class="sr-s">${esc((it.s||"").slice(0,60))}</span></div>`).join("")
  ).join("");
  res.querySelectorAll("[data-cat]").forEach(el=>el.addEventListener("click",()=>{
    const cat=el.dataset.cat, id=el.dataset.id, scn=el.dataset.scn;
    closeSearch();
    if(scn){ state.activeId=scn; section="elements"; elementsTab=cat==="scene"?"npcs":cat; render(); setTimeout(()=>{ if(cat==="scene") openSceneEditor(id); else openCardEditor(cat,id); },80); return; }
    if(cat==="scene") openSceneEditor(id);
    else { elementsTab=cat; openCardEditor(cat,id); }
  }));
}

/* ===== Extended check (graph reachability, unreferenced handouts) ===== */
function renderCheck(host){
  const a=active(), num=numbering(a);
  const ordered=orderedScenes(a);
  const firstId=ordered.length?ordered[0].id:null;
  const incoming={}, outgoing={};
  a.edges.forEach(e=>{ incoming[e.to]=(incoming[e.to]||0)+1; outgoing[e.from]=(outgoing[e.from]||0)+1; });
  const issues=[];
  // 기존 점검
  a.scenes.forEach(s=>{
    if(!incoming[s.id]&&s.type!=="도입"&&s.id!==firstId)
      issues.push({sev:"warn",cat:"scene",id:s.id,t:`${String(num[s.id]).padStart(2,"0")} ${s.title||"제목 없음"}`,d:"이 씬으로 이어지는 분기가 없어 — 도달 경로가 끊겨 있어."});
  });
  const lastId=ordered.length?ordered[ordered.length-1].id:null;
  a.scenes.forEach(s=>{
    if(!outgoing[s.id]&&s.type!=="엔딩"&&s.id!==lastId)
      issues.push({sev:"warn",cat:"scene",id:s.id,t:`${String(num[s.id]).padStart(2,"0")} ${s.title||"제목 없음"}`,d:"다음으로 이어지는 씬이 없어 — 막다른 길이야."});
  });
  a.scenes.forEach(s=>{
    if((s.type==="조사"||s.type==="단서")&&!s.clues.length)
      issues.push({sev:"warn",cat:"scene",id:s.id,t:`${String(num[s.id]).padStart(2,"0")} ${s.title||"제목 없음"}`,d:`${s.type} 씬인데 배치된 단서가 없어.`});
  });
  a.scenes.forEach(s=>{
    if(!stripHtml(s.readAloud||"").trim()&&!stripHtml(s.desc||"").trim())
      issues.push({sev:"info",cat:"scene",id:s.id,t:`${String(num[s.id]).padStart(2,"0")} ${s.title||"제목 없음"}`,d:"낭독·진행이 비어 있어 — 아직 작성 전이야."});
  });
  const usedClues=new Set(); a.scenes.forEach(s=>s.clues.forEach(id=>usedClues.add(id)));
  a.clues.forEach(c=>{ if(!usedClues.has(c.id)) issues.push({sev:"warn",cat:"clues",id:c.id,t:c.name||"이름 없는 단서",d:"어느 씬에도 배치되지 않은 단서야."}); });
  const usedNpc=new Set(); a.scenes.forEach(s=>s.npcs.forEach(id=>usedNpc.add(id)));
  a.npcs.forEach(n=>{ if(!usedNpc.has(n.id)) issues.push({sev:"info",cat:"npcs",id:n.id,t:n.name||"이름 없는 인물",d:"어느 씬에도 등장하지 않는 NPC야."}); });
  const usedLoc=new Set(); a.scenes.forEach(s=>s.locations.forEach(id=>usedLoc.add(id)));
  a.locations.forEach(l=>{ if(!usedLoc.has(l.id)) issues.push({sev:"info",cat:"locations",id:l.id,t:l.name||"이름 없는 장소",d:"어느 씬에서도 방문하지 않는 장소야."}); });
  // 그래프 도달성 (DFS)
  if(firstId&&a.edges.length){
    const adj={}; a.edges.forEach(e=>{ adj[e.from]=adj[e.from]||[]; adj[e.from].push(e.to); });
    const visited=new Set(); const dfs=id=>{ if(visited.has(id)) return; visited.add(id); (adj[id]||[]).forEach(dfs); };
    dfs(firstId);
    a.scenes.forEach(s=>{ if(!visited.has(s.id)&&s.id!==firstId&&s.type!=="도입"&&!incoming[s.id]){}
      else if(!visited.has(s.id)&&s.id!==firstId)
        issues.push({sev:"warn",cat:"scene",id:s.id,t:`${String(num[s.id]).padStart(2,"0")} ${s.title||"제목 없음"}`,d:"시작 씬에서 분기를 따라가도 이 씬에 도달할 수 없어."});
    });
  }
  // 단서 연결: 배치됐지만 어디로 이어지는지 미정
  a.clues.forEach(c=>{ if(usedClues.has(c.id)&&!(c.leadsScenes||[]).length&&!(c.leadsTo||"").trim())
    issues.push({sev:"info",cat:"clues",id:c.id,t:c.name||"이름 없는 단서",d:"어디로 이어지는 단서인지 정해지지 않았어."}); });
  (a.clues||[]).forEach(c=>(c.leadsScenes||[]).forEach(sid=>{ if(!a.scenes.some(x=>x.id===sid)) c.leadsScenes=c.leadsScenes.filter(x=>x!==sid); }));

  if(!issues.length){
    host.innerHTML=`<div class="chk-allgood">구조에 막힌 곳이 없어.<div class="sub">고립·막다른 씬, 빈 단서, 미도달 씬이 보이지 않아.</div></div>`;
    return;
  }
  const warns=issues.filter(i=>i.sev==="warn"), infos=issues.filter(i=>i.sev==="info");
  const itemHtml=i=>`<div class="chk-item ${i.sev}" data-go="${i.cat}" data-id="${i.id}">
    <div class="ci-main"><div class="ci-t">${esc(i.t)}</div><div class="ci-d">${esc(i.d)}</div></div>
    <span class="ci-go">열기 →</span></div>`;
  let html="";
  if(warns.length) html+=`<div class="chk-group"><div class="chk-h">주의<span class="badge warn">${warns.length}</span></div>${warns.map(itemHtml).join("")}</div>`;
  if(infos.length) html+=`<div class="chk-group"><div class="chk-h">참고<span class="badge info">${infos.length}</span></div>${infos.map(itemHtml).join("")}</div>`;
  host.innerHTML=html;
  host.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",()=>{
    const cat=el.dataset.go, id=el.dataset.id;
    if(cat==="scene") openSceneEditor(id);
    else if(cat==="handouts"){ elementsTab="handouts"; section="elements"; render(); setTimeout(()=>openCardEditor("handouts",id),80); }
    else openCardEditor(cat,id);
  }));
}

/* ===== Global bindings ===== */
function bindGlobal(){
  document.getElementById("rail").addEventListener("click",e=>{ const b=e.target.closest("[data-sec]"); if(b){ section=b.dataset.sec; render(); } });
  const cur=document.getElementById("scnCurrent"), menu=document.getElementById("scnMenu");
  cur.addEventListener("click",e=>{ e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click",()=>menu.classList.remove("open"));
  menu.addEventListener("click",e=>{
    e.stopPropagation();
    const del=e.target.closest("[data-del]");
    if(del){ const id=del.dataset.del;
      if(Object.keys(state.scenarios).length<=1){ alert("마지막 시나리오는 삭제할 수 없어."); return; }
      if(!confirm("이 시나리오를 휴지통으로 이동할까?")) return;
      const nm=state.scenarios[id]&&state.scenarios[id].title||"시나리오";
      cloudDelete(id); delete state.scenarios[id]; if(state.activeId===id) state.activeId=Object.keys(state.scenarios)[0];
      menu.classList.remove("open"); render(); syncSoon();
      showToast(`"${nm}" 휴지통으로 이동됨`); return; }
    if(e.target.closest("[data-new]")){ menu.classList.remove("open"); openTemplateModal(); return; }
    const item=e.target.closest("[data-id]"); if(item){ menu.classList.remove("open"); setActive(item.dataset.id); }
  });
  document.getElementById("drawerClose").addEventListener("click",closeDrawer);
  document.getElementById("scrim").addEventListener("click",closeDrawer);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
  const acct=document.getElementById("btnAcct"), am=document.getElementById("acctMenu");
  acct.addEventListener("click",e=>{ e.stopPropagation(); am.classList.toggle("open"); });
  document.addEventListener("click",()=>am.classList.remove("open"));
  am.addEventListener("click",e=>e.stopPropagation());
  on("btnLogout","click",async()=>{ am.classList.remove("open"); await sb.auth.signOut(); });
  on("btnTrash","click",()=>{ am.classList.remove("open"); openTrashModal(); });
  on("btnVersions","click",()=>{ am.classList.remove("open"); openVersionModal(); });
  on("btnBackupExport","click",()=>{ am.classList.remove("open"); exportFullBackup(); });
  on("btnBackupImport","click",()=>{ am.classList.remove("open"); document.getElementById("backupFileInput").click(); });
  document.getElementById("backupFileInput").addEventListener("change",importFullBackup);
  document.getElementById("btnExport").addEventListener("click",openExportModal);
  window.addEventListener("beforeprint",preparePrint);
  window.addEventListener("afterprint",restorePrint);
  document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change",importJSON);
  document.getElementById("btnSearch").addEventListener("click",openSearch);
  document.getElementById("searchScrim").addEventListener("click",closeSearch);
  document.getElementById("searchInput").addEventListener("input",e=>runSearch(e.target.value));

  // Mode toggle
  on("btnModeEdit","click",()=>{ playMode=false; document.getElementById("btnModeEdit").classList.add("on"); document.getElementById("btnModePlay").classList.remove("on"); if(section==="outline"&&boardView==="flow") renderOutline(document.getElementById("main")); });
  on("btnModePlay","click",()=>{ playMode=true; document.getElementById("btnModePlay").classList.add("on"); document.getElementById("btnModeEdit").classList.remove("on"); boardView="flow"; if(section==="outline") renderOutline(document.getElementById("main")); else { section="outline"; render(); } });

  // Conflict banner
  on("conflictRefresh",  "click",()=>{ hideConflictBanner(); location.reload(); });
  on("conflictDismiss",  "click",()=>hideConflictBanner());
  on("conflictForce","click",async()=>{
    const id=document.getElementById("conflictBanner").dataset.id; if(!id) return;
    hideConflictBanner();
    // Force save: reset rev to whatever is in DB then re-save
    const {data}=await sb.from("scenarios").select("rev").eq("id",id).maybeSingle();
    if(data) loadedRev[id]=data.rev||0;
    dirtyIds.add(id); flushSaves();
  });

  // Template modal confirm
  on("templateConfirm","click",()=>{
    const title=prompt("시나리오 제목")||"새 시나리오";
    document.getElementById("templateModal").classList.remove("open");
    const s=createFromTemplate(title); state.scenarios[s.id]=s; setActive(s.id);
  });

  // Modal close via data-closemodal
  document.querySelectorAll("[data-closemodal]").forEach(b=>b.addEventListener("click",()=>document.getElementById(b.dataset.closemodal).classList.remove("open")));

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ closeSearch(); document.querySelectorAll(".modal-scrim.open").forEach(m=>m.classList.remove("open")); }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openSearch(); }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){
      const ae=document.activeElement, tag=ae&&ae.tagName;
      if(focus.active) return;   // 집중 모드는 에디터 자체 되돌리기 사용
      if(tag!=="INPUT"&&tag!=="TEXTAREA"&&tag!=="SELECT"&&!(ae&&ae.isContentEditable)){ e.preventDefault(); undoPop(); }
    }
  });
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(()=>{ if(section==="manuscript") sizeAllGrows(); }); }
  bindFocus();
}
</script>
